# Render Blueprint for the alpha deployment -- see docs/deployment.md's
# "Alpha hosting (Render)" section. New -> Blueprint in the Render
# dashboard, point at this repository; Render reads this file.
services:
  - type: web
    name: knowledge-engine-web-alpha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      # Required together -- set both in the Render dashboard's
      # Environment tab. sync: false means Render prompts for these
      # rather than storing them in this file.
      - key: KE_WEB_ALPHA_USERNAME
        sync: false
      - key: KE_WEB_ALPHA_PASSWORD
        sync: false
      # AI-O15: public Research Copilot must fail closed unless an operator
      # provisions a real Render persistent disk mounted at /var/data. These
      # settings do not create or purchase that disk; without it, /ask remains
      # retrieval-only even if the other AI settings are added later.
      - key: KE_WEB_SESSION_STORAGE_MODE
        value: persistent
      - key: KE_WEB_SESSION_PERSISTENT_ROOT
        value: /var/data
      - key: KE_WEB_SESSION_DB_PATH
        value: /var/data/research_sessions.sqlite3
      # Hosted Research mode must prove that the configured `ke` executable is
      # the complete command surface AI can actually invoke, not merely any
      # executable with that path/name. The probe is cached and --help-only.
      - key: KE_WEB_CORE_CLI_COMMAND_PREFLIGHT
        value: "true"
      # GQR-4/GQR-5: accessible full text acquired by Research mode is reusable
      # research state, not an ephemeral cache. Keep it on the same persistent
      # disk contract as Research Sessions.
      - key: KE_WEB_RESEARCH_PAPERS_DIR
        value: /var/data/research_papers
      # AI-O16: process-local safety defaults for the optional compute path.
      # They do not make the missing hosted AI prerequisites available.
      - key: KE_WEB_AI_REQUEST_TIMEOUT_SECONDS
        value: "180"
      - key: KE_WEB_AI_MAX_CONCURRENT_REQUESTS
        value: "1"
      - key: KE_WEB_AI_RATE_LIMIT_REQUESTS
        value: "3"
      - key: KE_WEB_AI_RATE_LIMIT_WINDOW_SECONDS
        value: "600"
      # WEB-GQR-4: return a durable session immediately, run Research Copilot
      # in the process-local bounded worker, and let the Ask page poll progress.
      - key: KE_WEB_ASYNC_RESEARCH_ENABLED
        value: "true"
      # WEB-FRD-1: process-local safety defaults for the separate, opt-in
      # live-provider discovery path (`/discover`).
      - key: KE_WEB_DISCOVERY_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: KE_WEB_DISCOVERY_MAX_CONCURRENT_REQUESTS
        value: "1"
      - key: KE_WEB_DISCOVERY_RATE_LIMIT_REQUESTS
        value: "5"
      - key: KE_WEB_DISCOVERY_RATE_LIMIT_WINDOW_SECONDS
        value: "600"
      # WEB-FRD-5 item 6: declares the same persistent-disk contract AI-O15
      # established for Research Sessions, now for the federated-discovery
      # ledger -- "since your last search" is otherwise silently false after
      # every redeploy. Like AI-O15, this does not provision or purchase a
      # Render disk; without an operator-attached disk at /var/data, the
      # ledger stays on ephemeral container storage and discovery capability
      # fails closed per docs/ai_o15_deployed_session_persistence.md's same
      # procedure.
      - key: KE_WEB_DISCOVERY_LEDGER_STORAGE_MODE
        value: persistent
      - key: KE_WEB_DISCOVERY_LEDGER_PERSISTENT_ROOT
        value: /var/data
      - key: KE_WEB_FEDERATED_DISCOVERY_LEDGER_ROOT
        value: /var/data/federated_discovery_runs
