[tool.poetry]
name = "knowledge-engine-web"
version = "0.1.0a1"
description = "Read-only web interface for the Knowledge Engine: renders core's validated evidence and knowledge graph for a person."
authors = ["Knowledge Engine Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "knowledge_engine_web" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
# Keep the security floor explicit rather than relying only on FastAPI's
# transitive lower bound. Starlette 1.3.1 is the first release outside the
# complete advisory range known at the time of this launch-gate update.
starlette = "^1.6.0"
jinja2 = "^3.1.4"
uvicorn = ">=0.34,<0.53"
pydantic-settings = "^2.3.0"
sqlalchemy = "^2.0.31"
# AI-O13: git dependency, not a path dependency -- these are separate
# GitHub repos with no shared package registry, and unlike core (read
# via SQLAlchemy reflection, never imported), this really is a Python
# import. See docs/web_design.md's "Planned: full orchestrator
# integration" section for why, and knowledge-engine-ai's
# docs/web_integration_design.md for the real dependency-weight cost
# this adds (core's full stack, torch included, once `ke` needs to run
# as a subprocess). AI-O16 bounds that runtime but does not make it part
# of the current Render image or provision hosted inference.
knowledge-engine-ai = { git = "https://github.com/jweter/knowledge-engine-ai.git", rev = "62387aabba4b8621bea5621dcc7c88f40e91c6bb" }

[tool.poetry.group.dev.dependencies]
mypy = "^2.1.0"
pytest = "^9.1.1"
ruff = "0.16.2"
httpx = "^0.28.0"
pip-audit = "^2.10.1"

[tool.poetry.scripts]
knowledge-engine-web = "knowledge_engine_web.main:run"
knowledge-engine-retrieval-benchmark = "knowledge_engine_web.retrieval_benchmark:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
