name: Update Ask contract tests

on:
  push:
    branches:
      - fix/ask-research-default
    paths:
      - .github/workflows/update-ask-contract-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ask-research-default
          fetch-depth: 0
      - name: Update legacy Ask assertions for Research-first contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_main.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    assert "Experimental retrieval" in response.text\n',
                  '    assert "Ask Knowledge Engine" in response.text\n',
              ),
              (
                  '''def test_ask_without_synthesize_shows_no_synthesis_block(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    engine = build_engine(tmp_path)\n    evidence_path = _setup_paper_with_evidence(engine, tmp_path)\n    monkeypatch.setenv("KE_WEB_DATABASE_URL", _database_url(tmp_path))\n    monkeypatch.setenv("KE_WEB_EVIDENCE_RECORDS_PATH", str(evidence_path))\n    monkeypatch.setattr(main, "evaluate_ai_capability", lambda settings: _available_capability())\n\n    response = TestClient(app).get("/ask", params={"q": "does semaglutide reduce body weight"})\n\n    assert response.status_code == 200\n    assert "Research Copilot result" not in response.text\n''',
                  '''def test_ask_quick_mode_shows_no_synthesis_block(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    engine = build_engine(tmp_path)\n    evidence_path = _setup_paper_with_evidence(engine, tmp_path)\n    monkeypatch.setenv("KE_WEB_DATABASE_URL", _database_url(tmp_path))\n    monkeypatch.setenv("KE_WEB_EVIDENCE_RECORDS_PATH", str(evidence_path))\n    monkeypatch.setattr(main, "evaluate_ai_capability", lambda settings: _available_capability())\n\n    response = TestClient(app).get(\n        "/ask", params={"q": "does semaglutide reduce body weight", "quick": "1"}\n    )\n\n    assert response.status_code == 200\n    assert "Research Copilot result" not in response.text\n    assert 'name="quick" value="1" checked' in response.text\n''',
              ),
              (
                  '''    assert 'type="checkbox" disabled aria-disabled="true"' in response.text\n    assert (\n        "Research Copilot unavailable on this deployment; Ask is retrieval-only." in response.text\n    )\n''',
                  '''    assert 'name="quick" value="1"' not in response.text\n    assert "Broader Research is unavailable on this deployment" in response.text\n    assert "Ask will use indexed retrieval only." in response.text\n''',
              ),
              (
                  '''    assert 'name="synthesize" value="1"' in response.text\n    assert 'type="checkbox" disabled' not in response.text\n    assert "Also run Research Copilot" in response.text\n''',
                  '''    assert 'name="quick" value="1"' in response.text\n    assert "Research is on by default." in response.text\n    assert "Fast indexed search only" in response.text\n''',
              ),
              (
                  '''    assert "Research Copilot is unavailable on this deployment." in response.text\n    assert "Retrieval results are shown below." in response.text\n''',
                  '''    assert "Broader Research is unavailable on this deployment." in response.text\n    assert "Indexed retrieval results are shown below." in response.text\n''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing test anchor: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit test contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_main.py
          git commit -m "Update Ask tests for Research-first behavior"
          git push origin HEAD:fix/ask-research-default
