name: Refresh GQR lock

on:
  push:
    branches:
      - agent/web-grounded-research-mode
    paths:
      - pyproject.toml
      - .github/workflows/refresh-gqr-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/web-grounded-research-mode
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Refresh lock
        run: poetry lock
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          if git diff --cached --quiet; then
            echo "Lock already current."
            exit 0
          fi
          git commit -m "Refresh lock for grounded Research mode"
          git push origin HEAD:agent/web-grounded-research-mode
