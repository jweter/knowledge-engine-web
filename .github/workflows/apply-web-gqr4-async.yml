name: Apply WEB-GQR-4 async slice

on:
  push:
    branches:
      - feature/web-gqr-4-async-research
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'feature/web-gqr-4-async-research' || github.ref_name == 'feature/web-gqr-4-async-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/web-gqr-4-async-research

      - name: Repair generated string escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_web_gqr4_async_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('+ "\\n", media_type=', '+ "\\\\n", media_type=')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply deterministic patch
        run: python scripts/apply_web_gqr4_async_patch.py

      - name: Repair generated lint width
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('knowledge_engine_web/main.py')
          text = path.read_text(encoding='utf-8')
          old = '                copilot_error = "That research session belongs to a different question. Start a new Research run."\n'
          new = (
              '                copilot_error = (\n'
              '                    "That research session belongs to a different question. "\n'
              '                    "Start a new Research run."\n'
              '                )\n'
          )
          if text.count(old) != 1:
              raise RuntimeError('generated lint target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_web_gqr4_async_patch.py
          rm .github/workflows/apply-web-gqr4-async.yml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Format
        run: poetry run ruff format .

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy knowledge_engine_web tests

      - name: Test
        run: poetry run pytest

      - name: Diff hygiene
        run: git diff --check

      - name: Commit validated WEB-GQR-4 slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish WEB-GQR-4 async research polling slice"
          git push origin HEAD:feature/web-gqr-4-async-research
