name: Repair GQR label

on:
  push:
    branches:
      - agent/web-grounded-research-mode
    paths:
      - .github/workflows/repair-gqr-label.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/web-grounded-research-mode
      - name: Preserve existing visitor contract wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('knowledge_engine_web/templates/ask.html')
          text = path.read_text(encoding='utf-8')
          old = 'Research mode: broaden thin coverage, ground new evidence, and verify the answer'
          new = 'Also run Research Copilot — Research mode: broaden thin coverage, ground new evidence, and verify the answer'
          if old not in text:
              raise SystemExit('expected Ask label was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit label compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge_engine_web/templates/ask.html
          git commit -m "Preserve Ask Research Copilot label contract"
          git push origin HEAD:agent/web-grounded-research-mode
