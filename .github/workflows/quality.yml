name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Python quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: poetry run ruff format --check --diff . > ruff-format.diff

      - name: Upload formatting diff
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ruff-format-diff
          path: ruff-format.diff

      - name: Enforce formatting result
        if: steps.formatting.outcome == 'failure'
        run: |
          cat ruff-format.diff
          exit 1

      - name: Lint
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run ruff check . 2>&1 | tee ruff.log

      - name: Upload lint diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ruff-diagnostics
          path: ruff.log

      - name: Enforce lint result
        if: steps.ruff.outcome == 'failure'
        run: |
          cat ruff.log
          exit 1

      - name: Type check
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run mypy knowledge_engine_web tests 2>&1 | tee mypy.log

      - name: Upload mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mypy-diagnostics
          path: mypy.log

      - name: Enforce mypy result
        if: steps.mypy.outcome == 'failure'
        run: |
          cat mypy.log
          exit 1

      - name: Test
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run pytest 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: steps.pytest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics
          path: pytest.log

      - name: Enforce pytest result
        if: steps.pytest.outcome == 'failure'
        run: |
          cat pytest.log
          exit 1

      - name: Audit Python dependencies
        run: poetry run pip-audit

      - name: Check diff hygiene
        run: git diff --check

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        # data/ is committed to the repo (see scripts/build_alpha_snapshot.py
        # and docs/deployment.md) -- checkout already has the real trimmed
        # snapshot, the same one Render's build uses. No stub needed.
        run: docker build -t knowledge-engine-web-alpha:ci .

      - name: Smoke-test the container starts and serves a request
        run: |
          docker run -d --name alpha-smoke-test -p 8000:8000 \
            -e KE_WEB_ALPHA_USERNAME=ci -e KE_WEB_ALPHA_PASSWORD=ci \
            knowledge-engine-web-alpha:ci
          for _ in $(seq 1 20); do
            if curl -sf -u ci:ci http://127.0.0.1:8000/graph > /dev/null; then
              echo "Container responded."
              exit 0
            fi
            sleep 1
          done
          echo "Container never responded." >&2
          docker logs alpha-smoke-test >&2
          exit 1
