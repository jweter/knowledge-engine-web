name: GQR lock refresh

on:
  push:
    branches:
      - agent/gqr-research-state-rendering

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/gqr-research-state-rendering
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Regenerate lock from the current project dependency contract
        run: poetry lock --no-interaction

      - name: Commit regenerated lock and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gqr-lock-refresh.yml
          git add poetry.lock
          git diff --cached --check
          git commit -m "Refresh lock for AI research-state contract"
          git push origin HEAD:agent/gqr-research-state-rendering
