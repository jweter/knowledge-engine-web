name: Temporary lock generation

on:
  push:
    branches:
      - feat/research-report-v1-backend

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install "poetry==2.3.3"
      - name: Regenerate lock
        run: poetry lock
      - name: Commit regenerated lock when changed
        shell: bash
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "chore: refresh Poetry lock for Research Report v1"
          git push
      - name: Upload lock
        uses: actions/upload-artifact@v7
        with:
          name: poetry-lock
          path: poetry.lock
