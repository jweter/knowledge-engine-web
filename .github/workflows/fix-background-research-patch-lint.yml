name: Fix background research patch lint

on:
  push:
    branches:
      - agent/background-research-polling
    paths:
      - .github/workflows/fix-background-research-patch-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/background-research-polling

      - name: Let Ruff apply deterministic import ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-background-research-polling.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          poetry run ruff format knowledge_engine_web tests\n          poetry run ruff check knowledge_engine_web tests\n          poetry run mypy knowledge_engine_web tests\n'''
          new = '''          poetry run ruff format knowledge_engine_web tests\n          poetry run ruff check --fix knowledge_engine_web tests\n          poetry run ruff format knowledge_engine_web tests\n          poetry run ruff check knowledge_engine_web tests\n          poetry run mypy knowledge_engine_web tests\n'''
          if text.count(old) != 1:
              raise SystemExit(f'quality anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fixer and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-background-research-polling.yml
          git rm .github/workflows/fix-background-research-patch-lint.yml
          git commit -m "Let Ruff fix deterministic patch formatting"
          git push origin HEAD:agent/background-research-polling
