name: Replay background research source patch

on:
  push:
    branches:
      - agent/background-research-polling
    paths:
      - .github/workflows/replay-background-research-patch.yml

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/background-research-polling

      - name: Replay source patch with deterministic Ruff fix
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/apply-background-research-polling.yml').read_text(encoding='utf-8')
          )
          run_steps = [
              step['run']
              for step in workflow['jobs']['patch']['steps']
              if isinstance(step, dict) and 'run' in step
          ]
          # Apply production edits and add regression tests exactly as authored.
          for script in run_steps[:2]:
              subprocess.run(['bash', '-e', '-c', script], check=True)

          # The two poll payload shapes intentionally differ; make the shared
          # variable's broad JSON contract explicit for strict mypy.
          main_path = Path('knowledge_engine_web/main.py')
          main_text = main_path.read_text(encoding='utf-8')
          anchor = '''        payload = {\n            "session_id": memory_state.session_id,\n'''
          replacement = '''        payload: dict[str, object] = {\n            "session_id": memory_state.session_id,\n'''
          if main_text.count(anchor) != 1:
              raise SystemExit(f'poll payload annotation anchor={main_text.count(anchor)}')
          main_path.write_text(main_text.replace(anchor, replacement, 1), encoding='utf-8')

          # Replace the first-draft tests with fully typed fixtures. Runtime
          # behavior is unchanged; this only satisfies the repo's strict test typing.
          Path('tests/test_research_background.py').write_text('''from __future__ import annotations\n\nimport time\nfrom concurrent.futures import Future\nfrom types import SimpleNamespace\nfrom typing import cast\n\nimport pytest\n\nimport knowledge_engine_web.research_background as module\nfrom knowledge_engine_web.ai_orchestration import WebResearchResult\nfrom knowledge_engine_web.config import Settings\nfrom knowledge_engine_web.research_background import (\n    BackgroundResearchBusy,\n    read_background_memory_state,\n    start_background_research,\n)\n\n\ndef _settings(monkeypatch: pytest.MonkeyPatch) -> Settings:\n    monkeypatch.setenv("KE_WEB_AI_MAX_CONCURRENT_REQUESTS", "1")\n    return Settings()\n\n\ndef _stub_result() -> WebResearchResult:\n    return cast(WebResearchResult, SimpleNamespace())\n\n\ndef _stub_runner(\n    settings: Settings,\n    question: str,\n    *,\n    client_key: str,\n    session_id: str,\n) -> WebResearchResult:\n    del settings, question, client_key, session_id\n    return _stub_result()\n\n\ndef test_start_uses_exact_generated_id_for_runner(monkeypatch: pytest.MonkeyPatch) -> None:\n    settings = _settings(monkeypatch)\n    captured: dict[str, str] = {}\n\n    def runner(\n        settings: Settings,\n        question: str,\n        *,\n        client_key: str,\n        session_id: str,\n    ) -> WebResearchResult:\n        del settings\n        captured.update(question=question, client_key=client_key, session_id=session_id)\n        return _stub_result()\n\n    started = start_background_research(\n        settings,\n        "  Does creatine help?  ",\n        client_key="client-1",\n        runner=runner,\n    )\n    module._JOBS[started.session_id].future.result(timeout=2)\n\n    assert captured["question"] == "Does creatine help?"\n    assert captured["client_key"] == "client-1"\n    assert captured["session_id"] == started.session_id\n    assert started.status_url.endswith(started.session_id)\n\n\ndef test_active_capacity_is_bounded(monkeypatch: pytest.MonkeyPatch) -> None:\n    settings = _settings(monkeypatch)\n    pending: Future[WebResearchResult] = Future()\n    monkeypatch.setattr(\n        module,\n        "_JOBS",\n        {"occupied": module._BackgroundJob(pending, time.monotonic())},\n    )\n\n    with pytest.raises(BackgroundResearchBusy):\n        start_background_research(\n            settings,\n            "Question?",\n            client_key="client-1",\n            runner=_stub_runner,\n        )\n\n\ndef test_memory_state_reports_starting_job(monkeypatch: pytest.MonkeyPatch) -> None:\n    pending: Future[WebResearchResult] = Future()\n    monkeypatch.setattr(\n        module,\n        "_JOBS",\n        {"session-1": module._BackgroundJob(pending, time.monotonic())},\n    )\n\n    state = read_background_memory_state("session-1")\n\n    assert state is not None\n    assert state.status == "starting"\n    assert state.terminal is False\n''', encoding='utf-8')

          quality = run_steps[2].replace(
              'poetry run ruff format knowledge_engine_web tests\npoetry run ruff check knowledge_engine_web tests',
              'poetry run ruff format knowledge_engine_web tests\n'
              'poetry run ruff check --fix knowledge_engine_web tests\n'
              'poetry run ruff format knowledge_engine_web tests\n'
              'poetry run ruff check knowledge_engine_web tests',
              1,
          )
          subprocess.run(['bash', '-e', '-c', quality], check=True)
          PY

      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge_engine_web tests pyproject.toml poetry.lock
          git commit -m "Run Research mode in a background durable session"
          git push origin HEAD:agent/background-research-polling
