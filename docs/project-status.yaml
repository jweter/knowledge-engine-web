next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  current_action: "This session (2026-08-23, following PR #84's merge, branch claude/kind-brahmagupta-i9bkun) picked up the first of the two discretionary candidates the 2026-08-22 session recorded in the `action` field below: styling knowledge_engine_web/templates/ask.html's '.discovery-method-details'/'.ask-trace-events' classes (the 'Research path (session trace)' disclosure) so it reads as an intentional, designed part of the page instead of a bare unstyled <details> block. Confirmed via grep that neither selector had any rule in static/style.css. Reused the site's existing visual language rather than inventing a new one: .discovery-method-details gets the same bordered/rounded card treatment as .ask-evidence-entry (background: var(--bg), contrasting against its .ask-result-card/.ask-synthesis parent's var(--bg-alt), exactly like .ask-evidence-entry already does inside the same parent), a styled <summary> (pointer cursor, bold, var(--accent) on hover/focus), and spacing rules for its <dl>/<dt>/<dd> provenance fields (dt in var(--text-muted), bold, matching the muted-label convention used elsewhere on the site); .ask-trace-events renders each trace event as its own bordered row (var(--bg-alt) background) instead of a plain list. No new CSS custom property was added -- every value reuses an existing token. Because '.discovery-method-details' is shared with discover.html's four existing disclosure sections (search-method-and-provenance, publication-status observations by provider, provider-disagreement, and since-your-last-search freshness), this fix also gives those their first real styling as a side effect -- still styling-only, no markup or data changed on either template. Added tests/test_main.py::test_discovery_method_details_has_visible_styling (stylesheet-rule assertion, mirrors test_trust_warning_is_critical_has_visible_styling's and test_publication_status_banner_degraded_has_visible_styling's existing pattern of regex-asserting a dedicated CSS rule with border+background exists, so this can't silently regress back to unstyled). Full local quality_preflight.py passed: ruff format --check, ruff check, mypy (55 source files), pytest (362 passed, 361 pre-existing plus 1 new test function), pip-audit (no known vulnerabilities, network access was available this session), git diff --check. Docker's CI job was not run locally (no Docker daemon available in this session, same limitation prior sessions recorded). No Core or knowledge-engine-ai change, no pinned-commit change, no template/markup change -- CSS and test only. This session ran under externally-supplied one-shot instructions (same framing as the 2026-08-22 session that opened PR #84) rather than this repository's own automation_contract (draft_prs: never) -- the opened PR (#85, https://github.com/jweter/knowledge-engine-web/pull/85) is intentionally a DRAFT left for independent CI and human/next-session merge, per that same PR #84 precedent."
  action: "The second discretionary candidate the 2026-08-22 session recorded is explicitly out of scope for this session and still open for a future one: revisit whether copilot_error/synthesis_error/the incomplete-workflow notice in ask.html also deserve a non-muted '.trust-warning' treatment now that class exists, or whether '.empty-state' is the intentionally-quieter register for those -- this is a product/design judgment call, not a styling-gap fix, and was deliberately not touched this session. Beyond that, no further currently authorized Web-only product-shaped implementation slice is known. The remaining documented ideas in this roadmap's 'Improvements beyond the external reference' section (user-controlled source scope, /ask export parity, search-quality-vs-evidence-quality UX distinction) still need a real product decision before they are buildable without inventing requirements. knowledge-engine-ai's 2026-08-22 session-freshness slice (AI PR #65) does not create Web-side work: Web's /ask does not pass a discovery_policy to run_research_question, so AI-FRD-5 session freshness is not yet reachable from Web at all -- that remains a distinct, not-yet-authorized future slice, not this session's to start unilaterally."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

