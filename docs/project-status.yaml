schema_version: 1
project: knowledge-engine-web
updated_at: "2026-08-20T02:30:00Z"
status_source: "Verified repository state plus docs/web_design.md and docs/federated_discovery_transparency_roadmap.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_surface: "Read-only FastAPI web front end over knowledge-engine-core's SQLite database"
  role_in_family: "consumer of knowledge-engine-core (direct SQLite reflection) and knowledge-engine-ai (ke_client.py subprocess boundary)"
  opt_in_ai_features:
    - route: "/ask"
      capability: "Research Copilot synthesis via knowledge-engine-ai's run_research_question"
      guard: "own AIRequestGuard instance, KE_WEB_AI_* settings"
    - route: "/discover"
      capability: "Live federated discovery via knowledge-engine-ai's federated_discover() -> Core's ke federated-discover"
      guard: "own AIRequestGuard instance, KE_WEB_DISCOVERY_* settings"

current_milestone:
  name: "WEB-FRD (federated discovery transparency) sequence"
  roadmap_file: "docs/federated_discovery_transparency_roadmap.md"
  state: "active"
  sub_milestone_status:
    WEB-FRD-1_provider_coverage: "complete -- /discover page renders provider status from Core's own recorded outcome, never inferred from result count"
    WEB-FRD-2_search_provenance_details: "complete -- all 5 exit criteria met. knowledge-engine-ai PR #51 parsed Core's coverage.created_at into FederatedDiscoveryResult.search_run_created_at; this session bumped Web's pinned knowledge-engine-ai commit to fd5964c0f9632d4622224b5d2608d32bc7b34989 (was f4715d32a62748ec1ff395ee57402d192362c1a5) and rendered the field in discover.html's 'Run timestamp' row, with an explicit 'not recorded' disclosure when the value is None."
    WEB-FRD-3_work_identity_provider_observations: "complete and merged to main. /discover calls build_discovery_presentation() and discover.html renders per-candidate disagreement state."
    WEB-FRD-4_publication_status_warnings: "implemented this session for the retraction/preprint slice Core+AI currently expose (see docs/federated_discovery_transparency_roadmap.md's WEB-FRD-4 status paragraph). Required bumping knowledge-engine-ai's pinned commit to f4715d32a62748ec1ff395ee57402d192362c1a5 (carries FederatedCandidateSummary.observation_flags, merged via AI PR #49) -- a backward-compatible dependency advance. Correction/expression-of-concern/withdrawal states remain out of scope: Core's ProviderObservation does not carry those fields yet."
    WEB-FRD-5_research_freshness_history: "partially implemented this session. Core's FRD-6 follow-up (--research-question-id/--project-id, federated-discover-history) and knowledge-engine-ai's matching ke_client.federated_discover_history() wrapper (with federated_discover() forwarding both IDs) had both merged; this session bumped Web's pinned knowledge-engine-ai commit to f65e340d4d280840a49f3c10a8693dd5aadcc340 (was fd5964c0f9632d4622224b5d2608d32bc7b34989) and implemented design doc items 5-6 in full: research_question.py's derive_research_question_id() (a deterministic function of normalized query text, not a bookmark token) and discovery_ledger_storage_mode/discovery_ledger_persistent_root (mirroring AI-O15's session-storage split exactly, render.yaml declaring the /var/data contract). Item 7 (diff rendering) is implemented only at the run level: discovery_freshness.py's build_discovery_freshness() compares aggregate candidate count and provider coverage against the most recent prior run, rendered in discover.html's new 'Since your last search' section. Two of four WEB-FRD-5 exit criteria remain genuinely unmet: 'newly discovered works are visible' and 'new corrections/retractions are highlighted' both need a specific past run's candidate list, which ke_client.federated_discover_history() deliberately does not return (only aggregate SearchCoverageReport facts) -- knowledge-engine-ai's own introducing commit declined to also wrap federated-coverage-report for point lookups since that Core command has no --output JSON option. Rendering per-candidate freshness from data this project does not have would repeat the look-alike shortcut WEB-FRD-4 already declined once; discover.html states the limitation explicitly instead. See docs/roadmap/web_frd5_freshness_history_design.md section 9 for the full account and the concrete Core ask (a JSON-reachable single-past-run candidate lookup) that would unblock the remainder."
    WEB-FRD-6_inspectable_research_path: "implemented for the /ask Research Copilot session path. ask.html renders knowledge-engine-ai's already-computed SessionTrace (per-step tool/model/duration/notes, evidence-record IDs touched) in a closed-by-default 'Research path (session trace)' <details> section, and the specific unresolved required Research ISA close-gate criteria (close_result.validation.unresolved_required_criteria) instead of only the aggregate status enum. 2026-08-19 follow-up (PR #72, merged): the Skeptic verification artifact itself is now inspectable too -- ask.html renders a visible-by-default 'Verification findings' list naming the specific hallucinated citations, ungrounded numbers, and missed qualifying/contradicting evidence records (VerificationResult.hallucinated_citations/.ungrounded_numbers/.missed_qualifiers) whenever verification ran and is not clean, instead of only the one-word 'flagged for review' summary. All fields already existed on ResearchQuestionResult/VerificationResult (since AI-O6/AI-O9) and reached ask.html's context unused -- the same built-but-unreachable pattern already fixed for WEB-FRD-1/WEB-FRD-3. No Core or AI change needed; Web-only template/test addition. Does not cover /discover's federated-discovery search context (already served by WEB-FRD-2/WEB-FRD-3)."

automation_contract:
  schedule_role: "repository participant in an hourly portfolio-development loop (owner-managed; not created by this session)"
  new_roadmap_pr_budget_per_run: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  draft_prs: "never"
  merge_method: "squash"
  required_pr_workflows:
    - name: "Quality"
      file: ".github/workflows/quality.yml"
      job: "checks"
      note: "ruff format --check, ruff check, mypy, pytest"
    - name: "Docker build"
      file: ".github/workflows/quality.yml"
      job: "docker"
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-19T15:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  open_prs: 0
  ci_workflows:
    - ".github/workflows/quality.yml"
  local_quality_preflight:
    script: "scripts/quality_preflight.py"
    note: "Added this session -- was the one repository in the family still missing this pattern (knowledge-engine-core has scripts/quality_preflight.py, knowledge-engine-ai has scripts/preflight.py). Mirrors this repository's own checks job order: ruff format --check, ruff check, mypy knowledge_engine_web tests, pytest, pip-audit, git diff --check."

next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session: bumped the pinned knowledge-engine-ai revision to f65e340d4d280840a49f3c10a8693dd5aadcc340 (carries ke_client.federated_discover_history() and project_id/research_question_id forwarding on federated_discover()), then implemented WEB-FRD-5 design doc items 5-6 in full and a run-level (not candidate-level) slice of item 7 -- see the WEB-FRD-5_research_freshness_history entry above and docs/roadmap/web_frd5_freshness_history_design.md section 9 for the complete account. New modules: research_question.py (deterministic tracked-question identity), discovery_freshness.py (pure run-level diff, no I/O). discovery_orchestration.py gained run_discovery_history() and a persistent-mode-aware ledger capability check mirroring ai_orchestration.py's session-storage split. discover.html renders a new 'Since your last search' section, degrading silently (no section, main result unaffected) if the history lookup fails. Next continuation: the one concrete remaining Core ask, recorded in the design doc's section 9, is a way to reach a specific past run's full candidate list (not just its aggregate SearchCoverageReport) through a JSON-reachable ke_client boundary -- e.g. a --output option on federated-coverage-report -- which would let a future Web session close WEB-FRD-5's remaining two exit criteria (specific newly discovered works, specific newly retracted candidates). This is a Core-repository change; nothing further to do here until it lands and knowledge-engine-ai wraps it. Separately, WEB-FRD-4 remains only partially closed for unrelated reasons: correction/expression-of-concern/withdrawal states still need a Core schema change (new ProviderObservation fields) before an AI change and then a Web change could render them."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

human_decision_required: null

