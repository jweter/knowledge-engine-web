schema_version: 1
project: knowledge-engine-web
updated_at: "2026-08-30T02:42:00Z"
status_source: "Verified repository state plus docs/web_design.md, docs/general_question_research_loop_v1.md, and docs/federated_discovery_transparency_roadmap.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_surface: "Read-only FastAPI web front end over knowledge-engine-core's SQLite database"
  role_in_family: "consumer of knowledge-engine-core (direct SQLite reflection) and knowledge-engine-ai (ke_client.py subprocess boundary)"
  opt_in_ai_features:
    - route: "/ask"
      capability: "Research Copilot synthesis via knowledge-engine-ai's run_research_question"
      guard: "own AIRequestGuard instance, KE_WEB_AI_* settings"
    - route: "/discover"
      capability: "Live federated discovery via knowledge-engine-ai's federated_discover() -> Core's ke federated-discover"
      guard: "own AIRequestGuard instance, KE_WEB_DISCOVERY_* settings"

current_milestone:
  name: "General Question Research Loop v1 (GQR), WEB-GQR sub-sequence"
  roadmap_file: "docs/general_question_research_loop_v1.md"
  state: "active"
  latest_update: "WEB-GQR-0, WEB-GQR-1, WEB-GQR-1B, WEB-GQR-2, and WEB-GQR-3 are all complete and merged to main (PRs #87, #90, #94, #96, #97 respectively -- verified directly from this checkout's git history, not from a cached count). This session (2026-08-30) implements the first WEB-GQR-4 slice (durable research-session polling foundation). Discovered that the durable, redeploy-surviving session store WEB-GQR-4 asks for already exists: knowledge-engine-ai's SessionRepository already persists a ResearchSession header plus one ResearchEvent row per completed workflow step to Settings.session_db_path as /ask?synthesize=1 executes, and session_storage_mode/session_persistent_root already give it the local/persistent redeploy-survival split. Rather than building a second, duplicate Web-owned session store (the originally recommended shape for this run), this session added a strictly read-only projection of that same store -- new module knowledge_engine_web/research_session_status.py (opens the store mode=ro, derives a last_completed_stage label from the latest durably recorded *completed* workflow_node using the exact stage vocabulary docs/general_question_research_loop_v1.md's WEB-GQR-4 section documents) -- and a new GET /ask/session/{session_id} route returning that state as small JSON (session id, question, status, last_completed_stage, terminal, timestamps, event count); unknown session id or no store yet both 404. /ask's own synchronous request/response shape is completely unchanged. Live-verified against a real uvicorn process (not just fake-transport tests): seeded a session through the real SessionRepository, read it back over HTTP, then started an entirely new server process against the same on-disk SQLite file to confirm the state survives a process restart the way a redeploy would see it. Same-run follow-up PR #103 (after #102 merged): chatgpt-codex-connector's automated review found the field was originally named current_stage despite only ever reflecting the latest *completed* step (renamed to last_completed_stage, documented as stale-by-one-step during an in-flight run, exact once terminal), and that a corrupt/non-database session-store file raised an uncaught sqlite3.DatabaseError instead of 404ing (the narrower except sqlite3.OperationalError didn't catch it; broadened to sqlite3.DatabaseError, added a regression test). quality_preflight.py green after the fix (400 tests). Not done yet: no frontend polls this endpoint, and /ask?synthesize=1 still runs the whole research session inline within one HTTP request rather than as a background task, so there is nothing to poll during an in-flight run yet. See docs/general_question_research_loop_v1.md's WEB-GQR-4 entry and docs/web_design.md's matching 'Implemented' section for the full account. The underlying WEB-FRD (federated discovery transparency) sequence referenced by an earlier version of this file is complete (WEB-FRD-1 through WEB-FRD-6, all in docs/federated_discovery_transparency_roadmap.md) and is no longer the active milestone -- GQR is."
  sub_milestone_status:
    WEB-FRD-1_provider_coverage: "complete -- /discover page renders provider status from Core's own recorded outcome, never inferred from result count"
    WEB-FRD-2_search_provenance_details: "complete -- all 5 exit criteria met. knowledge-engine-ai PR #51 parsed Core's coverage.created_at into FederatedDiscoveryResult.search_run_created_at; this session bumped Web's pinned knowledge-engine-ai commit to fd5964c0f9632d4622224b5d2608d32bc7b34989 (was f4715d32a62748ec1ff395ee57402d192362c1a5) and rendered the field in discover.html's 'Run timestamp' row, with an explicit 'not recorded' disclosure when the value is None."
    WEB-FRD-3_work_identity_provider_observations: "complete and merged to main. /discover calls build_discovery_presentation() and discover.html renders per-candidate disagreement state."
    WEB-FRD-4_publication_status_warnings: "complete -- PR #77 merged on 2026-08-21. Web pins AI commit 58c21b1 and independently renders retraction, correction, expression-of-concern, withdrawal, and preprint state while preserving every provider's raw observation and keeping unreported distinct from explicit false. 2026-08-22 CSS fix (this session): the 'Corrected'/'newly corrected' banner's is-degraded class had no stylesheet rule and rendered unstyled; added .publication-status-banner.is-degraded plus a --status-degraded-bg token so it gets the same visible-banner treatment as the is-critical warnings. See docs/federated_discovery_transparency_roadmap.md's WEB-FRD-4 section and docs/web_design.md's matching entry."
    WEB-FRD-5_research_freshness_history: "complete this session. Core's second FRD-6 follow-up (PR #394, commit 96d30ac: candidate-snapshot persistence plus 'federated-coverage-report --output') and knowledge-engine-ai's matching ke_client.federated_coverage_report() point-lookup wrapper (PR #55, commit 2cab16b) had both merged; this session bumped Web's pinned knowledge-engine-ai commit to 2cab16b47bb9d3f42d777e989bf2637e8310fb4d (was f65e340d4d280840a49f3c10a8693dd5aadcc340) and closed the candidate-level slice of item 7 that a prior session left deliberately deferred. discovery_orchestration.py gained run_discovery_candidate_snapshot(); discovery_presentation.py's publication-status rollup was made public (build_publication_status()) for reuse; discovery_freshness.py gained build_candidate_freshness(), diffing the current run's candidates against one past run's full snapshot by canonical_id to report specific newly discovered works and specific candidates whose retraction status flipped ('was clear/not checked, now retracted'). main.py composes this as a second, best-effort, additive lookup over the existing run-level freshness view (dataclasses.replace, no change to the existing build_discovery_freshness() function or its tests). discover.html renders 'Newly discovered works' and 'Newly flagged as retracted' sections reusing WEB-FRD-3's candidate-card markup (extracted into a local Jinja macro) and WEB-FRD-4's retraction banner -- no new presentation format invented, per the design doc's own instruction. All four WEB-FRD-5 exit criteria are now resolved: 'newly discovered works are visible' and 'new corrections/retractions are highlighted' (retraction half) are met; 'provider-coverage changes are shown' was already met; 'old synthesis is versioned' is not applicable to /discover (no synthesis step exists there). Live-verified against the real ke binary end to end (not just fake-transport tests): a knowledge-engine-core checkout at the PR #394 commit was installed, a ledger was seeded via Core's own FederatedSearchLedger.record() with two runs for one tracked question, and a local server driven through the real ke federated-discover-history and ke federated-coverage-report --output subprocess calls rendered the expected newly-discovered/newly-retracted sections. 332 tests pass (318 pre-existing plus 14 new); full local quality_preflight.py passed. Docker's CI job was not run locally (no Docker daemon available in this session); CI remains the first real check of the built image for this pyproject.toml/poetry.lock change. See docs/roadmap/web_frd5_freshness_history_design.md section 10 for the full account. Correction/expression-of-concern/withdrawal states were out of scope at the time, same as WEB-FRD-4; that Core-side block has since cleared -- see the WEB-FRD-4 entry above. 2026-08-20 PR #75 review follow-up: a P1 review comment identified that a prior run recorded before Core PR #394's candidate-snapshot persistence existed (nonzero candidate_count, empty candidates tuple) was wrongly trusted as a valid zero-candidate baseline, misreporting every current candidate as newly discovered; fixed via discovery_freshness.candidate_snapshot_is_usable(), which falls back to the existing run-level-only comparison when the snapshot's candidate_count is inconsistent with its returned candidates. See docs/roadmap/web_frd5_freshness_history_design.md section 11. 333 tests pass (332 plus the new regression test, confirmed fail-before/pass-after)."
    WEB-FRD-6_inspectable_research_path: "implemented for the /ask Research Copilot session path. ask.html renders knowledge-engine-ai's already-computed SessionTrace (per-step tool/model/duration/notes, evidence-record IDs touched) in a closed-by-default 'Research path (session trace)' <details> section, and the specific unresolved required Research ISA close-gate criteria (close_result.validation.unresolved_required_criteria) instead of only the aggregate status enum. 2026-08-19 follow-up (PR #72, merged): the Skeptic verification artifact itself is now inspectable too -- ask.html renders a visible-by-default 'Verification findings' list naming the specific hallucinated citations, ungrounded numbers, and missed qualifying/contradicting evidence records (VerificationResult.hallucinated_citations/.ungrounded_numbers/.missed_qualifiers) whenever verification ran and is not clean, instead of only the one-word 'flagged for review' summary. All fields already existed on ResearchQuestionResult/VerificationResult (since AI-O6/AI-O9) and reached ask.html's context unused -- the same built-but-unreachable pattern already fixed for WEB-FRD-1/WEB-FRD-3. No Core or AI change needed; Web-only template/test addition. Does not cover /discover's federated-discovery search context (already served by WEB-FRD-2/WEB-FRD-3). 2026-08-23 visual-polish follow-up (this session, branch claude/kind-brahmagupta-i9bkun): picked up the first of the two discretionary candidates the 2026-08-22 session recorded below -- the 'Research path (session trace)' <details> block's '.discovery-method-details'/'.ask-trace-events' classes had no stylesheet rule at all and rendered as a bare unstyled <details>. Added .discovery-method-details (card border/background/radius matching .ask-evidence-entry's existing card-in-card convention, styled <summary>, and spacing for its <dl>/<dt>/<dd> provenance fields) and .ask-trace-events (each trace event rendered as its own bordered row) to static/style.css, reusing existing --border/--bg/--bg-alt/--text-muted/--accent tokens -- no new token, no new visual language, matching the pattern already used for the WEB-FRD-4 and verification-findings styling fixes. Note: '.discovery-method-details' is shared with discover.html's four existing disclosure sections (search-method-and-provenance, publication-status observations, provider-disagreement, and freshness), so this fix also gives those their first real styling rather than only touching ask.html's usage -- styling-only, no markup or data change on either page. Added tests/test_main.py::test_discovery_method_details_has_visible_styling (stylesheet-rule assertion, mirrors test_trust_warning_is_critical_has_visible_styling's pattern). Full local quality_preflight.py passed: ruff format --check, ruff check, mypy (55 source files), pytest (362 passed, 361 pre-existing plus 1 new test function), pip-audit (no known vulnerabilities), git diff --check. Docker's CI job was not run locally (no Docker daemon available in this session, same limitation prior sessions recorded). No Core or knowledge-engine-ai change, no pinned-commit change. This session ran under externally-supplied one-shot instructions (same as the 2026-08-22 session that opened PR #84) rather than this repository's own automation_contract, so the opened PR (#85) is intentionally a DRAFT left for independent CI and human/next-session merge, per the PR #84 precedent recorded in the prior next_continuation entry below."

automation_contract:
  schedule_role: "repository participant in an hourly portfolio-development loop (owner-managed; not created by this session)"
  new_roadmap_pr_budget_per_run: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  draft_prs: "never"
  merge_method: "squash"
  required_pr_workflows:
    - name: "Quality"
      file: ".github/workflows/quality.yml"
      job: "checks"
      note: "ruff format --check, ruff check, mypy, pytest"
    - name: "Docker build"
      file: ".github/workflows/quality.yml"
      job: "docker"
  advisory_review_unavailable_is_not_failure: true

