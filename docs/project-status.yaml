status_source: "Verified repository state plus docs/web_design.md and docs/federated_discovery_transparency_roadmap.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_surface: "Read-only FastAPI web front end over knowledge-engine-core's SQLite database"
  role_in_family: "consumer of knowledge-engine-core (direct SQLite reflection) and knowledge-engine-ai (ke_client.py subprocess boundary)"
  opt_in_ai_features:
    - route: "/ask"
      capability: "Research Copilot synthesis via knowledge-engine-ai's run_research_question"
      guard: "own AIRequestGuard instance, KE_WEB_AI_* settings"
    - route: "/discover"
      capability: "Live federated discovery via knowledge-engine-ai's federated_discover() -> Core's ke federated-discover"
      guard: "own AIRequestGuard instance, KE_WEB_DISCOVERY_* settings"

current_milestone:
  name: "WEB-FRD (federated discovery transparency) sequence"
  roadmap_file: "docs/federated_discovery_transparency_roadmap.md"
  state: "active"
  sub_milestone_status:
    WEB-FRD-1_provider_coverage: "complete -- /discover page renders provider status from Core's own recorded outcome, never inferred from result count"
    WEB-FRD-2_search_provenance_details: "complete -- all 5 exit criteria met. knowledge-engine-ai PR #51 parsed Core's coverage.created_at into FederatedDiscoveryResult.search_run_created_at; this session bumped Web's pinned knowledge-engine-ai commit to fd5964c0f9632d4622224b5d2608d32bc7b34989 (was f4715d32a62748ec1ff395ee57402d192362c1a5) and rendered the field in discover.html's 'Run timestamp' row, with an explicit 'not recorded' disclosure when the value is None."
    WEB-FRD-3_work_identity_provider_observations: "complete and merged to main. /discover calls build_discovery_presentation() and discover.html renders per-candidate disagreement state."
    WEB-FRD-4_publication_status_warnings: "implemented this session for the retraction/preprint slice Core+AI currently expose (see docs/federated_discovery_transparency_roadmap.md's WEB-FRD-4 status paragraph). Required bumping knowledge-engine-ai's pinned commit to f4715d32a62748ec1ff395ee57402d192362c1a5 (carries FederatedCandidateSummary.observation_flags, merged via AI PR #49) -- a backward-compatible dependency advance. Correction/expression-of-concern/withdrawal states remain out of scope: Core's ProviderObservation does not carry those fields yet."
    WEB-FRD-5_research_freshness_history: "not started"
    WEB-FRD-6_inspectable_research_path: "implemented for the /ask Research Copilot session path. ask.html renders knowledge-engine-ai's already-computed SessionTrace (per-step tool/model/duration/notes, evidence-record IDs touched) in a closed-by-default 'Research path (session trace)' <details> section, and the specific unresolved required Research ISA close-gate criteria (close_result.validation.unresolved_required_criteria) instead of only the aggregate status enum. 2026-08-19 follow-up (PR open): the Skeptic verification artifact itself is now inspectable too -- ask.html renders a visible-by-default 'Verification findings' list naming the specific hallucinated citations, ungrounded numbers, and missed qualifying/contradicting evidence records (VerificationResult.hallucinated_citations/.ungrounded_numbers/.missed_qualifiers) whenever verification ran and is not clean, instead of only the one-word 'flagged for review' summary. All fields already existed on ResearchQuestionResult/VerificationResult (since AI-O6/AI-O9) and reached ask.html's context unused -- the same built-but-unreachable pattern already fixed for WEB-FRD-1/WEB-FRD-3. No Core or AI change needed; Web-only template/test addition. Does not cover /discover's federated-discovery search context (already served by WEB-FRD-2/WEB-FRD-3)."

automation_contract:
  schedule_role: "repository participant in an hourly portfolio-development loop (owner-managed; not created by this session)"
  new_roadmap_pr_budget_per_run: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  draft_prs: "never"
  merge_method: "squash"
  required_pr_workflows:
    - name: "Quality"
      file: ".github/workflows/quality.yml"
      job: "checks"
      note: "ruff format --check, ruff check, mypy, pytest"
    - name: "Docker build"
      file: ".github/workflows/quality.yml"
      job: "docker"
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-19T15:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  open_prs: 0
  ci_workflows:
    - ".github/workflows/quality.yml"
  local_quality_preflight:
    script: "scripts/quality_preflight.py"
    note: "Added this session -- was the one repository in the family still missing this pattern (knowledge-engine-core has scripts/quality_preflight.py, knowledge-engine-ai has scripts/preflight.py). Mirrors this repository's own checks job order: ruff format --check, ruff check, mypy knowledge_engine_web tests, pytest, pip-audit, git diff --check."

next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session opened a draft PR completing the WEB-FRD-6 (inspectable research path) follow-up: ask.html now also renders the Skeptic verification check's specific findings (hallucinated citations, ungrounded numbers, missed qualifying/contradicting records) whenever a narrative is flagged, not only the one-word pass/fail summary -- the same built-but-unreachable gap this milestone already fixed for the session trace and close-gate criteria. Web-only, additive, no Core/AI change. Note: this PR was opened as draft:true per this run's orchestrator instructions, which differs from this file's own 'draft_prs: never' automation_contract entry recorded by earlier sessions -- flagged for the project owner to reconcile, not silently resolved by this session. First priority next run: check this PR's live state (fresh CI must be green before merge -- do not merge on this same run that opened it). The next not-started WEB-FRD slice is still WEB-FRD-5 (research freshness history) -- read its exit criteria in docs/federated_discovery_transparency_roadmap.md; confirmed this session that Core's FederatedSearchLedger only supports load-by-exact-run-ID today (no list/query-by-question capability), so WEB-FRD-5 genuinely needs a new Core capability plus a durable multi-run history/versioning design (bigger than a single-session slice, and a real product-scoping decision), not a mechanical wiring gap -- scope it carefully, likely starting in knowledge-engine-core, before starting here. WEB-FRD-4 remains only partially closed: correction/expression-of-concern/withdrawal states need a Core schema change (new ProviderObservation fields, and Crossref's underlying metadata provider does not currently parse Crossref's 'update-to' field at all) before an AI change and then a Web change could render them -- also bigger than one slice."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

