mobile_product_reality_track:
  name: "Mobile Product Reality"
  tracking_issue: "#140"
  portfolio_relation: "jweter/project-orchestrator#44"
  state: "backend/UI capability implemented and provenance-hardened; not yet acceptance-complete"
  implementation_state: "PR #141 added the sanitized MobileSmokeEvidence contract (privacy-safe question hashing, fail-closed automated evidence state, notes never in the public payload). PR #144 wired it to real data: mobile_smoke_evidence_from_job derives response_state/evidence_count/provenance_traceable from the same durable async-Research job payload Layer 2 already renders (never a second, divergent computation); mobile_review_store persisted one human PASS/FAIL/FLAG verdict per session_id; GET/POST /ask/session/{id}/mobile-review expose this; ask.html shows a PASS/FAIL/FLAG panel once a session reaches terminal state, gated by the same AlphaBasicAuthMiddleware as the rest of the deployment. Verified with a real uvicorn instance plus a headless Chromium (390px viewport) run of the actual template/JS -- not just unit tests; caught and fixed one real bug this way. PR #144 (this update) hardened provenance further per Jeremy's explicit request: (1) a recorded verdict now carries its own exact build identity (web_commit + verified flag) captured at submission time via web_build_identity()/build_identity_is_verified() -- RENDER_GIT_COMMIT for a real deploy, the new KE_WEB_BUILD_COMMIT for the zero-cost/local runtime that is now authoritative (see product_decisions), or an honest unverified placeholder -- and public_payload()'s review_authoritative/remaining_acceptance_debt fields refuse to present an unverified-build verdict as settled; (2) mobile_review_store is now append-only (a new SQLite row per submission, never an UPSERT), so an earlier FAIL/FLAG is never erased by a later PASS -- read_mobile_review still answers 'what is current', read_mobile_review_history exposes the full sequence, and the GET payload's review_history_count proves nothing was lost. Raw question text and free-form notes are still never returned in any payload."
  remaining_acceptance_debt: "Human iPhone Mobile Safari Product Reality review has not run. The review routes key off the async Research job projection, so they only serve sessions where Research mode actually ran -- on the current retrieval-only default Render deployment, a plain indexed Ask has no session to review through this path yet. Per the 2026-09-11 product decision, the fix is to verify Research capability on the zero-cost/local runtime (not paid hosted Research) and set KE_WEB_BUILD_COMMIT there so a real human review can be recorded as authoritative."
  not_done: "Issue #140 is not closed by this work; do not claim it complete without an actual recorded, authoritative (verified build identity) PASS/FAIL/FLAG from a real iPhone Safari session."

