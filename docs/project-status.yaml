next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session scoped WEB-FRD-5 (research freshness history) per Jeremy's request ('scope it then work on it when you can manage it') and produced docs/roadmap/web_frd5_freshness_history_design.md. Finding: it is genuinely blocked on unbuilt Core and AI capability, not a mechanical Web wiring gap, confirmed with exact evidence (file:line citations in the design doc) rather than assumption. Concrete blockers, in dependency order: (1) knowledge-engine-core's `federated-discover` CLI never exposes the `research_question_id` parameter that FederatedDiscoveryService.search() and the ledger already accept; (2) FederatedSearchLedger supports point lookup by exact search_run_id only -- no list/filter-by-question read capability exists, so a new Core CLI command (e.g. `federated-discover-history`) is needed; (3) knowledge-engine-ai's ke_client has no wrapper for even the existing `federated-coverage-report` command, so Web cannot reach a single past run through the sanctioned boundary today, let alone a list; (4) ke_client.federated_discover() needs research_question_id forwarded once Core's CLI accepts it. Only after (1)-(4) land in Core/AI (same 'merges first, then Web bumps its pin' sequencing as WEB-FRD-2/3/4) does Web-side work become honest: a tracked-question identity for /discover, persistent-disk wiring for the ledger root (same pattern as KE_WEB_SESSION_STORAGE_MODE=persistent), and the diff-rendering route/template. A client-held same-browser-tab 'compare' shortcut was deliberately considered and rejected (design doc section 6) as a look-alike that cannot satisfy 'return after leaving and see what changed' and risks implying durability that doesn't exist. No Web code changed this session -- design document only, matching this project's own WEB-FRD-4 precedent of declining to approximate capability Core/AI have not yet built. Next continuation should file the two Core asks and two AI asks in their respective repos' roadmaps (cross-referenced from the design doc) before any Web-side WEB-FRD-5 code is attempted. WEB-FRD-4 remains only partially closed: correction/expression-of-concern/withdrawal states need a Core schema change (new ProviderObservation fields) before an AI change and then a Web change could render them."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

