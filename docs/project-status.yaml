mobile_product_reality_track:
  name: "Mobile Product Reality"
  tracking_issue: "#140"
  portfolio_relation: "jweter/project-orchestrator#44"
  state: "backend/UI capability merged (#144); provenance hardening + legacy-schema migration merged (#145); not yet acceptance-complete"
  implementation_state: "PR #141 (merged) added the sanitized MobileSmokeEvidence contract (privacy-safe question hashing, fail-closed automated evidence state, notes never in the public payload). PR #144 (merged) wired it to real data: mobile_smoke_evidence_from_job derives response_state/evidence_count/provenance_traceable from the same durable async-Research job payload Layer 2 already renders (never a second, divergent computation); mobile_review_store persisted one human PASS/FAIL/FLAG verdict per session_id (single-row-per-session, upserted); GET/POST /ask/session/{id}/mobile-review expose this; ask.html shows a PASS/FAIL/FLAG panel once a session reaches terminal state, gated by the same AlphaBasicAuthMiddleware as the rest of the deployment. Verified with a real uvicorn instance plus a headless Chromium (390px viewport) run of the actual template/JS -- not just unit tests; caught and fixed one real bug this way. That ad hoc verification approach is now committed, reusable infrastructure -- see browser_e2e_track below. PR #145 (merged) hardens provenance on top of merged #144 per Jeremy's explicit request: (1) a recorded verdict now carries its own exact build identity (web_commit + verified flag) captured at submission time via web_build_identity()/build_identity_is_verified() -- RENDER_GIT_COMMIT for a real deploy, the new KE_WEB_BUILD_COMMIT for the zero-cost/local runtime that is now authoritative (see product_decisions), or an honest unverified placeholder -- and public_payload()'s review_authoritative/remaining_acceptance_debt fields refuse to present an unverified-build verdict as settled; (2) mobile_review_store is now append-only (a new SQLite row per submission, never an UPSERT), so an earlier FAIL/FLAG is never erased by a later PASS -- read_mobile_review still answers 'what is current', read_mobile_review_history exposes the full sequence, and the GET payload's review_history_count proves nothing was lost; (3) because #144 already merged and could have created real databases on its own single-row-per-session schema, #145 also adds a transactional, idempotent migration (_ensure_migrated/_migrate_legacy_schema_if_needed in mobile_review_store.py) that detects that exact legacy shape before any read or write, atomically rewrites it into the append-only schema preserving every row, and marks every migrated row honestly unverified (empty web_commit, build_identity_verified=false) rather than fabricating a build identity it never recorded; an unrecognized schema is refused (RuntimeError) rather than guessed at. Raw question text and free-form notes are still never returned in any payload."
  remaining_acceptance_debt: "Human iPhone Mobile Safari Product Reality review has not run. The review routes key off the async Research job projection, so they only serve sessions where Research mode actually ran -- on the current retrieval-only default Render deployment, a plain indexed Ask has no session to review through this path yet. Per the 2026-09-11 product decision, the fix is to verify Research capability on the zero-cost/local runtime (not paid hosted Research) and set KE_WEB_BUILD_COMMIT there so a real human review can be recorded as authoritative."
  not_done: "Issue #140 is not closed by this work; do not claim it complete without an actual recorded, authoritative (verified build identity) PASS/FAIL/FLAG from a real iPhone Safari session."

browser_e2e_track:
  name: "Browser end-to-end testing"
  roadmap_file: "docs/browser_e2e_testing.md"
  tracking_issue: null
  state: "initial infrastructure landed and merged; Ask critical path plus refresh/resume, real-browser authentication, a widened automated accessibility pass across 7 pages (PR #150, merged), and now real keyboard-navigation coverage plus a skip-link fix it found missing (PR #151, open)"
  implementation_state: "tests/test_browser_e2e.py, tests/test_browser_e2e_auth.py, and tests/test_accessibility_e2e.py all start the real FastAPI app as a real uvicorn subprocess against real SQLite/JSONL fixture data and drive it with a real headless Chromium (Playwright sync API); shared fixtures live in tests/_browser_e2e_support.py and tests/conftest.py so every module (and future sibling modules) reuse one live-server/fixture-data setup instead of re-deriving it. No mocked backend authority: Research/AI capability is left genuinely unconfigured so the honest fail-closed 'Broader Research is unavailable' path is exercised rather than a faked result. test_browser_e2e.py covers: homepage load, an indexed direct-match citation with its /claims/{evidence_record_id} link, real navigation to that claim detail page, a no-fabrication miss state, a 390px mobile-viewport overflow check, and (this run) reloading the Ask page for the same indexed-only question reproduces the identical citation (refresh/resume, indexed-path scope only). test_browser_e2e_auth.py (this run, new module) closes the real-browser-authentication gap: a new live_app_with_alpha_auth fixture (tests/conftest.py) starts the real server with KE_WEB_ALPHA_USERNAME/PASSWORD configured, and three tests prove a real Chromium network stack refuses to render the gated page with no credentials (net::ERR_INVALID_AUTH_CREDENTIALS) or the wrong password (net::ERR_HTTP_RESPONSE_CODE_FAILURE), and loads it normally with the correct ones -- tests/test_alpha_auth.py already covered this middleware at the TestClient/ASGI level, this is the separate real-browser-network-stack evidence that was missing. test_accessibility_e2e.py runs real axe-core (via axe-playwright-python, which vendors axe.min.js -- no network access needed at test time) against seven real pages, all four axe-core impact levels (critical/serious/moderate/minor) enforced, all currently zero-violation (PR #149, merged). Both modules self-skip (not fail) when no Chromium executable is available. .github/workflows/browser-e2e.yml installs Chromium and runs the suite on every PR/push to main via `pytest -m browser_e2e`, deliberately as an advisory (non-required) job until it has proven stable -- see docs/agent-development-policy.md section 3 before promoting it into automation_contract.required_pr_workflows below."
  bugs_found_and_fixed_by_this_infrastructure:
    - "knowledge_engine_web/static/style.css .snapshot-line: the footer's real snapshot metadata (data/snapshot_metadata.json's corpus_id, a long comma/underscore-separated token with no wrap opportunity) overflowed a 390px viewport instead of wrapping. Fixed with overflow-wrap: anywhere."
    - "knowledge_engine_web/static/style.css .inspect-menu > div: the header's closed 'Inspect' dropdown relied only on native <details> open/closed hiding, but still occupied real off-canvas layout geometry (measured via getBoundingClientRect) in the real Chromium build these tests run against. Fixed by hiding it explicitly (display: none) and showing it only via .inspect-menu[open] > div, rather than trusting implicit browser behavior."
  not_done: "docs/INDUSTRY_REALITY_CHECK.md's remaining critical-path scenarios (indexed miss -> research-required state, partial-answer updates, degraded-provider state, durable async-Research-session refresh/resume) remain unaddressed -- all require real Research capability to exercise honestly, which this repository will not fake in a test fixture merely to gain coverage. Authentication and indexed-path refresh/resume are covered (PR #150, merged). Accessibility coverage (9 pages/states as of this run) is real but still narrow: axe-core's automated ruleset only catches roughly 30-50% of WCAG 2.2 AA success criteria industry-wide. A full manual keyboard-navigation/screen-reader pass has still not been performed, and the async-Research progress/report views plus the mobile Product Reality review panel remain uncovered (both require real Research capability). Do not treat any of this as WCAG 2.2 AA conformance evidence."

next_continuation:
  priority: "P-local-zero-cost-research-verification"
  action: "Paid Render Research infrastructure is intentionally deferred (2026-09-11 product decision, see product_decisions above) -- do not re-request that approval or apply render.research.yaml without a new explicit reversal. The next real progress step is to stand up and verify Research capability (Core + Ollama) on a zero-additional-cost/local runtime, set KE_WEB_BUILD_COMMIT to its exact commit, record an authoritative Mobile Product Reality review against it, then run Monster #79 through normal /ask on that verified local capability and fix any Product Reality failure until acceptance passes. This run re-confirmed that standup is still not attemptable from a fresh ephemeral scheduled-agent container (no persistent local Ollama/Core installation and no real iPhone Safari human reviewer available here) -- see human_decision_required -- and, per the anti-stall rule, did not re-attempt it or spend further runs rediscovering the same blocker. This run instead did parallel-safe Web-only work: extended tests/test_accessibility_e2e.py (2 new checks) and tests/test_keyboard_navigation_e2e.py (3 new checks) to cover /discover's real query form and its honest fail-closed unavailable-capability state, closing the last real, previously-zero-coverage interactive form reachable without Research/AI capability. Full local preflight GREEN (507 tests, up from 502) before opening a PR. A following run should first check this new PR's fresh CI/merge state (per the CI FOLLOW-UP HARD RULE this run does not itself watch or babysit it); if it is green and mergeable, the next genuinely new parallel-safe Web-only slice most consistent with docs/INDUSTRY_REALITY_CHECK.md is a documented manual WCAG 2.2 AA keyboard/screen-reader checklist pass (axe-core plus scripted Tab/Enter only cover ~30-50% of success criteria), since remaining browser-E2E/UX gaps (progressive research states, partial answers, degraded-provider UI, async-session resume, mobile review panel) all require the same blocked Research-capability standup."
  selection_rule: "Before beginning work, query live PR/CI/branch state. Existing failed, pending, conflicted, blocked, or merge-ready work takes priority. Never merge failed, pending, conflicted, blocked, or materially uncertain work."

human_decision_required: "None outstanding for Research infrastructure: Jeremy decided (2026-09-11) that paid Render Research infrastructure stays deferred and zero-additional-cost/local infrastructure is authoritative -- see product_decisions above. Do not re-raise the paid-infra approval ask; only a new explicit reversal from Jeremy changes this."

