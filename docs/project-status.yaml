product:
  primary_surface: "FastAPI Web/API/frontend layer for Knowledge Engine"
  role_in_family: "consumes knowledge-engine-core validated evidence and knowledge-engine-ai Research Copilot contracts"
  ask_status: "The deployed Ask path supports deterministic indexed retrieval plus asynchronous Research mode with durable session identity, background execution, polling, grounded-completion/re-retrieval, verified final release, provider/degradation transparency, citation provenance, and BT-2/BT-6 funnel/latency reporting. Research Report v1's structured answer-first contract is not yet rendered."

current_milestone:
  name: "Research Report v1 — answer-first Web integration and Monster acceptance"
  roadmap_file: "docs/research_report_v1.md"
  state: "active"
  tracking_issue: "#107"
  companion_ai_issue: "jweter/knowledge-engine-ai#129"
  acceptance_case: "jweter/knowledge-engine-ai#79 monster-energy-bp-one-year"
  objective: "Render a two-layer research report: Layer 1 answers the question clearly with bottom line plus dimension-specific conclusions/certainty; Layer 2 makes evidence, methodology, provenance, counter-evidence, coverage, and missing evidence inspectable without forcing the user to read pipeline internals first."
  implementation_state: "WEB-GQR-4 asynchronous Research Sessions with progressive Ask polling is complete and merged as PR #106. knowledge-engine-ai PRs #130 and #131 are merged and provide the structured ResearchReport contract plus safe completed-session integration seam. Web has not yet consumed/rendered that contract."
  blocking_gap: "Finish Web's AI dependency/lock update, carry the structured report through Web orchestration, render Layer 1 and Layer 2, then pass the deployed Monster #79 acceptance run."
  priority_rule: "Until Monster #79 passes on the deployed Ask path, Research Report v1 integration outranks decorative UI work and unrelated non-blocking backend abstractions."

research_report_v1_handoff:
  completed_foundation:
    - "PR #106 — asynchronous Research Sessions with progressive Ask polling — merged to main and validated with Quality, Docker, container smoke, and TruffleHog checks."
    - "Ask returns immediately with deterministic indexed retrieval while Research mode continues in the background."
    - "The page polls durable session state and renders only verified/releaseable final research output."
    - "Current Ask already exposes provider coverage/degradation, indexed-vs-new evidence provenance, acquisition/extraction funnel facts, limitations, resolved citations, and research latency."
    - "AI PR #130 provides the typed ResearchReport contract and deterministic validation."
    - "AI PR #131 provides a fail-closed completed-session integration seam that returns a ResearchReportBuildResult without weakening the base verified result."
  current_work_in_progress:
    branch: "feat/research-report-v1-backend"
    status: "WIP branch exists; no PR is open for it yet."
    verified_changes:
      - "pyproject.toml pins knowledge-engine-ai to merged AI commit 2eee4cc9ba76f99e669d2e52669e84d8b5199a41, which includes PRs #130 and #131."
      - "A temporary .github/workflows/generate-lock-temp.yml workflow was added only to regenerate poetry.lock with Poetry 2.3.3. Its workflow run succeeded and produced the poetry-lock artifact."
    required_cleanup_before_pr:
      - "Commit the regenerated poetry.lock corresponding to the new AI pin."
      - "Remove the temporary generate-lock-temp.yml workflow; it is scaffolding, not a permanent project workflow."
      - "Run the normal Web quality gate after the real implementation changes are complete."
  exact_next_sequence:
    - "1. Resume feat/research-report-v1-backend; reconcile it against current main before editing."
    - "2. Finish the knowledge-engine-ai pin/poetry.lock update and delete the temporary lock-generation workflow."
    - "3. In knowledge_engine_web/ai_orchestration.py, call AI's build_research_report_for_result() only from a releaseable completed ResearchQuestionResult and carry ResearchReportBuildResult through the Web-facing result contract. Do not scrape narrative prose to recover report semantics."
    - "4. Preserve the existing asynchronous session/polling behavior from PR #106; structured-report generation must not regress immediate indexed retrieval or truthful durable progress."
    - "5. Layer 1 on Ask: render the ResearchReport bottom_line prominently, then render conclusion_rows as question dimension + conclusion + certainty, with certainty rationale inspectable and missing_direct_evidence visible as a first-class limitation."
    - "6. Layer 2 on Ask: render supporting vs contradicting/null evidence IDs, directness, source/evidence links, direct vs class-level vs indirect distinctions, provider coverage/degradation, indexed-before-run vs acquired-during-run provenance, acquisition/extraction funnel, limitations, and session state. Reuse existing provenance/coverage components where possible instead of inventing parallel truth."
    - "7. If structured report generation is unavailable or fails, preserve the already-verified base result and show an honest structured-report-unavailable state; never replace a valid grounded answer with a fabricated report."
    - "8. Add focused tests proving the Web consumes structured fields, renders direct/indirect and null/counter-evidence distinctly, exposes missing one-year evidence, and does not infer report semantics from narrative text."
    - "9. Open the Web PR only after normal Quality + Docker checks are green; remove all temporary workflow scaffolding first."
    - "10. Deploy and run Monster #79 end to end. Record session ID, BT-2 funnel, time to first grounded information, time to final report, provider coverage/degradation, promoted Evidence Records, final ResearchState, every conclusion row, missing evidence, and resolved citations."
    - "11. Fail acceptance honestly on any unsupported claim, missing dimension, collapsed evidence boundary, omitted counter-evidence, hidden missing-one-year-evidence gap, or materially worse readability than the scholarly-assistant baseline. Fix and rerun until it passes."
  layer_1_required_dimensions_for_monster:
    - "acute post-consumption blood-pressure effect"
    - "persistent habitual/baseline/resting/ambulatory BP evidence"
    - "incident hypertension risk over longer follow-up"
    - "BP measurement artifact from recent caffeine intake"
    - "Zero Ultra vs Original Monster long-term context"
    - "whether direct approximately one-year Monster/energy-drink evidence was actually found"
    - "certainty and missing evidence for each conclusion"
  nonnegotiable_invariants:
    - "The main answer must be understandable without opening methodology."
    - "Web consumes structured AI report fields; it does not scrape narrative prose for conclusions, certainty, provenance, or evidence classifications."
    - "Direct Monster evidence, class-level energy-drink evidence, and indirect caffeine/coffee/soda evidence remain distinguishable."
    - "Positive and null/contradictory evidence remain inspectable."
    - "Missing direct long-duration evidence cannot be buried inside generic limitations."
    - "Provider degradation, provenance, and source links are never hidden merely to simplify the page."
    - "Research progress never claims a stage succeeded before durable state says it did."
    - "Existing deterministic verification and Research ISA release gates remain authoritative."
  done_when: "Research Report v1 is not complete until the deployed Monster #79 Ask report is at least as readable/useful as the scholarly-assistant baseline while satisfying every evidence/provenance/missing-evidence acceptance requirement."

