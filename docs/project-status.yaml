product:
  primary_surface: "FastAPI Web/API/frontend layer for Knowledge Engine"
  role_in_family: "consumes knowledge-engine-core validated evidence and knowledge-engine-ai Research Copilot contracts"
  ask_status: "The Ask path supports deterministic indexed retrieval plus asynchronous Research mode with durable session identity, background execution, polling, grounded-completion/re-retrieval, verified final release, provider/degradation transparency, citation provenance, and BT-2/BT-6 funnel/latency reporting. PRs #109-#113 completed the structured Research Report v1 Web path and made bounded Research the default whenever the deployment passes the capability gate. Core PR #451 is merged; Web PR #135 installs Core's slim Research runtime and persistent workspace bootstrap in the hosted container. Web PR #136 adds the explicit operator-gated full hosted Research Blueprint with durable Web storage plus a private Ollama service, and PR #137 hardens that private Ollama startup path. The active default Render deployment remains retrieval-only, and per the 2026-09-11 product decision above stays that way intentionally: paid hosted Research infra is deferred, and a zero-additional-cost/local runtime is now the authoritative path to Monster #79 acceptance instead."

current_milestone:
  name: "Research Report v1 — answer-first Web integration and Monster acceptance"
  roadmap_file: "docs/research_report_v1.md"
  state: "active"
  tracking_issue: "#107"
  companion_ai_issue: "jweter/knowledge-engine-ai#129"
  acceptance_case: "jweter/knowledge-engine-ai#79 monster-energy-bp-one-year"
  objective: "Render a two-layer research report: Layer 1 answers the question clearly with bottom line plus dimension-specific conclusions/certainty; Layer 2 makes evidence, methodology, provenance, counter-evidence, coverage, and missing evidence inspectable without forcing the user to read pipeline internals first."
  implementation_state: "WEB-GQR-4 asynchronous Research Sessions with progressive Ask polling is complete and merged as PR #106. knowledge-engine-ai PRs #130 and #131 provide the structured ResearchReport contract plus safe completed-session integration seam. Web PRs #109-#113 carry and render that report, expose the evidence audit trail and source-detail navigation, and make ordinary Ask enter bounded Research by default when capability exists. Core PR #451 merged the persistent Research workspace bootstrap. Web PR #135 merged the hosted Core Research runtime/workspace adoption. Web PR #136 merged the operator-gated full hosted Research Blueprint and private Ollama service definition (still valid code, deliberately not applied -- see product_decisions above). Web PR #137 merged a startup hardening fix that separates Ollama's private listen address from its loopback CLI client address. Repository-side Research runtime preparation is complete for both the paid hosted path (unused by decision) and, as of this update, the zero-cost/local path's own build-identity provenance (KE_WEB_BUILD_COMMIT)."
  blocking_gap: "No known repository-side code blocker remains for enabling Research. Per the 2026-09-11 product decision, the paid Render infrastructure path (render.research.yaml) is intentionally deferred and is no longer the plan of record -- do not treat it as a pending blocker or re-raise the approval ask. The actual next gap is operational, not architectural: run and verify Research capability (Core + Ollama) on a zero-additional-cost/local runtime, set `KE_WEB_BUILD_COMMIT` to that runtime's exact commit so Mobile Product Reality reviews against it are authoritative (see mobile_product_reality_track), and then run Monster #79 against that verified local capability."
  priority_rule: "Until Monster #79 passes against a verified zero-cost/local Research runtime, Research Report v1 integration and local-runtime Product Reality outrank decorative UI work and unrelated non-blocking backend abstractions."

research_report_v1_handoff:
  completed_foundation:
    - "PR #106 — asynchronous Research Sessions with progressive Ask polling — merged to main and validated with Quality, Docker, container smoke, and TruffleHog checks."
    - "Ask returns immediately with deterministic indexed retrieval while Research mode continues in the background."
    - "The page polls durable session state and renders only verified/releaseable final research output."
    - "Current Ask exposes provider coverage/degradation, indexed-vs-new evidence provenance, acquisition/extraction funnel facts, limitations, resolved citations, and research latency."
    - "AI PR #130 provides the typed ResearchReport contract and deterministic validation."
    - "AI PR #131 provides a fail-closed completed-session integration seam that returns a ResearchReportBuildResult without weakening the base verified result."
    - "PR #109 pinned the AI revision, carried ResearchReportBuildResult through WebResearchResult, and persisted its typed payload in durable async job results."
    - "PR #110 renders Layer 1 on Ask: bottom_line, conclusion_rows (dimension/conclusion/certainty/rationale), and missing_direct_evidence as a first-class limitation."
    - "PR #111 renders the structured Layer 2 audit trail for evidence relationships, directness, provenance, provider coverage/degradation, limitations, and session identity."
    - "PR #112 links Layer 2 EvidenceRecord IDs to the existing authoritative /claims/{evidence_record_id} route; docs/research_report_v1.md records a remaining richer inline study-detail follow-up where the authoritative detail surface lacks a requested study attribute."
    - "PR #113 makes ordinary Ask requests enter bounded Research by default when capability is complete; quick=1 is the explicit fast indexed-search opt-out, and legacy synthesize=1/0 URLs remain compatible."
    - "Core PR #451 merged the idempotent persistent Research workspace bootstrap and ke-research-workspace deployment surface."
    - "Web PR #135 installs the tested slim Core Research runtime in the hosted Web container and bootstraps Core's writable workspace when a real persistent mount is present."
    - "Web PR #136 adds render.research.yaml as an explicit operator-gated full Research deployment: persistent Web workspace plus a private qwen2.5:1.5b Ollama service and persistent model disk. It intentionally does not alter the active default render.yaml or incur cost merely by merging."
    - "Web PR #137 hardens private Ollama startup by binding the service on 0.0.0.0:11434 while using loopback for startup probes/model pull."
  current_work_in_progress: null
  exact_next_sequence:
    - "1. (Superseded 2026-09-11 -- paid Render infra is intentionally deferred, not pending approval.) Do not obtain operator approval for render.research.yaml or apply it without a new explicit decision reversing that."
    - "2. Stand up Research capability (Core + Ollama) on a zero-additional-cost/local runtime instead -- this is now the authoritative path."
    - "3. Set KE_WEB_BUILD_COMMIT to that local runtime's exact commit (e.g. `git rev-parse HEAD`) so `web_build_identity()`/Mobile Product Reality reviews recorded against it are authoritative, not just the unverified placeholder."
    - "4. Verify Product Reality against that local runtime: Core workspace bootstrap succeeds, Ollama is reachable, and a normal /ask submission enters a durable asynchronous Research session rather than retrieval-only fallback."
    - "5. Run Monster #79 end to end against that verified local capability. Record session ID, BT-2 funnel, time to first grounded information, time to final report, provider coverage/degradation, promoted Evidence Records, final ResearchState, every conclusion row, missing evidence, and resolved citations/source-detail navigation."
    - "6. Fail acceptance honestly on any unsupported claim, missing dimension, collapsed evidence boundary, omitted counter-evidence, hidden missing-one-year-evidence gap, broken evidence-detail navigation, or materially worse readability than the scholarly-assistant baseline. Fix and rerun until it passes."
  layer_1_required_dimensions_for_monster:
    - "acute post-consumption blood-pressure effect"
    - "persistent habitual/baseline/resting/ambulatory BP evidence"
    - "incident hypertension risk over longer follow-up"
    - "BP measurement artifact from recent caffeine intake"
    - "Zero Ultra vs Original Monster long-term context"
    - "whether direct approximately one-year Monster/energy-drink evidence was actually found"
    - "certainty and missing evidence for each conclusion"
  nonnegotiable_invariants:
    - "The main answer must be understandable without opening methodology."
    - "Web consumes structured AI report fields; it does not scrape narrative prose for conclusions, certainty, provenance, or evidence classifications."
    - "Direct Monster evidence, class-level energy-drink evidence, and indirect caffeine/coffee/soda evidence remain distinguishable."
    - "Positive and null/contradictory evidence remain inspectable."
    - "Missing direct long-duration evidence cannot be buried inside generic limitations."
    - "Provider degradation, provenance, and source links are never hidden merely to simplify the page."
    - "Research progress never claims a stage succeeded before durable state says it did."
    - "Existing deterministic verification and Research ISA release gates remain authoritative."
  done_when: "Research Report v1 is not complete until the deployed Monster #79 Ask report is at least as readable/useful as the scholarly-assistant baseline while satisfying every evidence/provenance/missing-evidence acceptance requirement."

