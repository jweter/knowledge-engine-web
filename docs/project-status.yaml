      capability: "Research Copilot synthesis via knowledge-engine-ai's run_research_question"
      guard: "own AIRequestGuard instance, KE_WEB_AI_* settings"
    - route: "/discover"
      capability: "Live federated discovery via knowledge-engine-ai's federated_discover() -> Core's ke federated-discover"
      guard: "own AIRequestGuard instance, KE_WEB_DISCOVERY_* settings"

current_milestone:
  name: "WEB-FRD (federated discovery transparency) sequence"
  roadmap_file: "docs/federated_discovery_transparency_roadmap.md"
  state: "active"
  sub_milestone_status:
    WEB-FRD-1_provider_coverage: "complete -- /discover page renders provider status from Core's own recorded outcome, never inferred from result count"
    WEB-FRD-2_search_provenance_details: "complete -- all 5 exit criteria met. knowledge-engine-ai PR #51 parsed Core's coverage.created_at into FederatedDiscoveryResult.search_run_created_at; this session bumped Web's pinned knowledge-engine-ai commit to fd5964c0f9632d4622224b5d2608d32bc7b34989 (was f4715d32a62748ec1ff395ee57402d192362c1a5) and rendered the field in discover.html's 'Run timestamp' row, with an explicit 'not recorded' disclosure when the value is None."
    WEB-FRD-3_work_identity_provider_observations: "complete and merged to main. /discover calls build_discovery_presentation() and discover.html renders per-candidate disagreement state."
    WEB-FRD-4_publication_status_warnings: "implemented this session for the retraction/preprint slice Core+AI currently expose (see docs/federated_discovery_transparency_roadmap.md's WEB-FRD-4 status paragraph). Required bumping knowledge-engine-ai's pinned commit to f4715d32a62748ec1ff395ee57402d192362c1a5 (carries FederatedCandidateSummary.observation_flags, merged via AI PR #49) -- a backward-compatible dependency advance. Correction/expression-of-concern/withdrawal states remain out of scope: Core's ProviderObservation does not carry those fields yet."
    WEB-FRD-5_research_freshness_history: "not started (code); scoped and documented as blocked this session -- see docs/roadmap/web_frd5_freshness_history_design.md. Core's federated-search ledger already has a research_question_id field threaded to FederatedDiscoveryService.search(), but the federated-discover CLI never exposes it, and the ledger supports point lookup by exact search_run_id only (no list/filter). knowledge-engine-ai's ke_client has no wrapper for the existing federated-coverage-report command at all, so even one historical run is unreachable from Web today. Web's /discover is also fully stateless with no tracked-question identity or persistent-disk ledger wiring. A client-held same-browser-tab compare was considered and rejected (design doc section 6) as a look-alike that can't satisfy the actual 'return later and see what changed' scenario. No Web code changed; design document only, per agent-development-policy.md section 6's rule against forcing a fabricated implementation when real capability is missing."
    WEB-FRD-6_inspectable_research_path: "implemented for the /ask Research Copilot session path this session (PR open). ask.html now renders knowledge-engine-ai's already-computed SessionTrace (per-step tool/model/duration/notes, evidence-record IDs touched) in a closed-by-default 'Research path (session trace)' <details> section, and the specific unresolved required Research ISA close-gate criteria (close_result.validation.unresolved_required_criteria) instead of only the aggregate status enum. Both fields already existed on ResearchQuestionResult and reached ask.html's context unused -- the same built-but-unreachable pattern already fixed for WEB-FRD-1/WEB-FRD-3. No Core or AI change needed; Web-only template/route addition. Does not cover /discover's federated-discovery search context (already served by WEB-FRD-2/WEB-FRD-3)."

