  implementation_state: "tests/test_browser_e2e.py, tests/test_browser_e2e_auth.py, and tests/test_accessibility_e2e.py all start the real FastAPI app as a real uvicorn subprocess against real SQLite/JSONL fixture data and drive it with a real headless Chromium (Playwright sync API); shared fixtures live in tests/_browser_e2e_support.py and tests/conftest.py so every module (and future sibling modules) reuse one live-server/fixture-data setup instead of re-deriving it. No mocked backend authority: Research/AI capability is left genuinely unconfigured so the honest fail-closed 'Broader Research is unavailable' path is exercised rather than a faked result. test_browser_e2e.py covers: homepage load, an indexed direct-match citation with its /claims/{evidence_record_id} link, real navigation to that claim detail page, a no-fabrication miss state, a 390px mobile-viewport overflow check, and reloading the Ask page for the same indexed-only question reproduces the identical citation (refresh/resume, indexed-path scope only). test_browser_e2e_auth.py closes the real-browser-authentication gap: a live_app_with_alpha_auth fixture (tests/conftest.py) starts the real server with KE_WEB_ALPHA_USERNAME/PASSWORD configured, and three tests prove a real Chromium network stack refuses to render the gated page with no credentials (net::ERR_INVALID_AUTH_CREDENTIALS) or the wrong password (net::ERR_HTTP_RESPONSE_CODE_FAILURE), and loads it normally with the correct ones -- tests/test_alpha_auth.py already covered this middleware at the TestClient/ASGI level, this is the separate real-browser-network-stack evidence that was missing. test_accessibility_e2e.py runs real axe-core (via axe-playwright-python, which vendors axe.min.js -- no network access needed at test time); as of this run it covers 17 real pages/states -- the original 9 (homepage, both Ask states, claim detail, graph summary, dashboard, claims list, /discover's two states) plus 8 more this run added (About, Roadmap, Demo's empty state, Reports index/view, Unconfirmed Claims, Relationship Candidates, paper detail) -- all four axe-core impact levels (critical/serious/moderate/minor) enforced, all currently zero-violation. This is now every page reachable without Research/AI capability configured. Both modules self-skip (not fail) when no Chromium executable is available. .github/workflows/browser-e2e.yml installs Chromium and runs the suite on every PR/push to main via `pytest -m browser_e2e`, deliberately as an advisory (non-required) job until it has proven stable -- see docs/agent-development-policy.md section 3 before promoting it into automation_contract.required_pr_workflows below."
  bugs_found_and_fixed_by_this_infrastructure:
    - "knowledge_engine_web/static/style.css's generic `code` rule had no `overflow-wrap`: a long unbroken token inside a `<code>` element (claim detail's `docs/evidence_intelligence_design.md` reference) overflowed the viewport by 13px at a 320px CSS width -- a real WCAG 1.4.10 (Reflow) violation, found by the new tests/test_reflow_and_focus_indicators_e2e.py. Fixed with `overflow-wrap: anywhere`, the same technique already used for `.snapshot-line`."
    - "knowledge_engine_web/static/style.css .snapshot-line: the footer's real snapshot metadata (data/snapshot_metadata.json's corpus_id, a long comma/underscore-separated token with no wrap opportunity) overflowed a 390px viewport instead of wrapping. Fixed with overflow-wrap: anywhere."
    - "knowledge_engine_web/static/style.css .inspect-menu > div: the header's closed 'Inspect' dropdown relied only on native <details> open/closed hiding, but still occupied real off-canvas layout geometry (measured via getBoundingClientRect) in the real Chromium build these tests run against. Fixed by hiding it explicitly (display: none) and showing it only via .inspect-menu[open] > div, rather than trusting implicit browser behavior."
    - "knowledge_engine_web/static/concept-preview.html .topbar: extending tests/test_reflow_and_focus_indicators_e2e.py's reflow check from 5 to all 17 test_accessibility_e2e.py pages/states found a real WCAG 1.4.10 violation -- the topbar's flex children (a white-space: nowrap wordmark, a max-width-only search bar, an Ask button) defaulted to min-width: auto, so their combined nowrap content width (600px+) never shrank, overflowing a 320px viewport by 671px. Fixed with a `@media (max-width: 480px)` rule wrapping the row, letting the wordmark wrap, and giving the search bar min-width: 0."
    - "knowledge_engine_web/static/concept-preview.html: PR #156's own new axe-core test against this standalone embedded preview document found 4 real violation classes -- serious color-contrast on --text-faint/--supports/--gap, moderate heading-order (h1 to h3), landmark-one-main, and region (no landmarks at all). Fixed by darkening the three color tokens to verified WCAG-AA-safe values, promoting column titles to h2/seam headings to h3, and adding header/main/footer landmarks."
    - "docs/manual_accessibility_checklist.md row 7a (2.2.2 Pause, Stop, Hide): the site-wide constellation canvas background and homepage headline aurora animation (knowledge_engine_web/static/knowledge_constellation.js/.css, active on every page via base.html's body.ke-constellation) ran indefinitely with no way to stop them short of an OS-level prefers-reduced-motion setting -- a real WCAG 2.2.2 violation, not just an untested criterion. Added a keyboard-operable #motion-toggle header control (base.html) that halts the canvas RAF loop and freezes the CSS keyframe animations via a runtime .motion-paused class mirroring the existing prefers-reduced-motion treatment, persisted via localStorage. tests/test_keyboard_navigation_e2e.py verifies keyboard operability, that the animation actually stops (computed animationDuration, not just class presence), and that the preference persists across reload/navigation."
    - "docs/manual_accessibility_checklist.md row 8 (2.4.3 Focus Order): tests/test_focus_order_e2e.py (this run) verifies no page has a positive tabindex and that a real full-page Tab traversal visits every visible focusable element in exactly its document order, on every page/state tests/test_accessibility_e2e.py covers. No behavioral bug was found in any page's tab order, but building the check found and fixed a real flaw in its own methodology: blur()-based focus reset does not reset the browser's sequential focus navigation starting point, so autofocusing pages (Ask, Discover) were silently only having their order's tail exercised; fixed by explicitly focusing the first tagged element. The Roadmap page's embedded concept-preview iframe is handled by tabbing past it without asserting on its internal order, which the standalone concept-preview page already covers."
  not_done: "docs/INDUSTRY_REALITY_CHECK.md's remaining critical-path scenarios (indexed miss -> research-required state, partial-answer updates, degraded-provider state, durable async-Research-session refresh/resume) remain unaddressed -- all require real Research capability to exercise honestly, which this repository will not fake in a test fixture merely to gain coverage. Authentication and indexed-path refresh/resume are covered (PR #150, merged). Accessibility coverage now spans all 17 pages/states reachable without Research capability (PR #156, merged) but axe-core's automated ruleset only catches roughly 30-50% of WCAG 2.2 AA success criteria industry-wide regardless of page count. A full manual keyboard-navigation/screen-reader pass has still not been performed, and the async-Research progress/report views plus the mobile Product Reality review panel remain uncovered (both require real Research capability). Do not treat any of this as WCAG 2.2 AA conformance evidence."

