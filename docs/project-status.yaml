product:
  primary_surface: "FastAPI Web/API/frontend layer for Knowledge Engine"
  role_in_family: "consumes knowledge-engine-core validated evidence and knowledge-engine-ai Research Copilot contracts"
  ask_status: "The deployed Ask path supports deterministic indexed retrieval plus asynchronous Research mode with durable session identity, background execution, polling, grounded-completion/re-retrieval, verified final release, provider/degradation transparency, citation provenance, and BT-2/BT-6 funnel/latency reporting. PR #109 carried the structured ResearchReport payload through Web orchestration and durable async job state, PR #110 merged answer-first Layer 1 rendering, PR #111 merged the expandable Layer 2 researcher audit trail, and PR #112 (merged) made Layer 2 EvidenceRecord IDs resolve through the existing authoritative /claims/{evidence_record_id} evidence/source-detail surface. PR #113 (merged) fixed a routing defect so ordinary Ask requests enter bounded Research by default, with quick=1 as the explicit fast indexed-search opt-out. PR #113 also recorded that the current hosted Render alpha still intentionally fails the Research capability gate pending a complete writable Core operational workspace, a deployable Core Research command surface, durable storage, and reachable inference. Deployed Monster #79 acceptance has not yet run."

current_milestone:
  name: "Research Report v1 — answer-first Web integration and Monster acceptance"
  roadmap_file: "docs/research_report_v1.md"
  state: "active"
  tracking_issue: "#107"
  companion_ai_issue: "jweter/knowledge-engine-ai#129"
  acceptance_case: "jweter/knowledge-engine-ai#79 monster-energy-bp-one-year"
  objective: "Render a two-layer research report: Layer 1 answers the question clearly with bottom line plus dimension-specific conclusions/certainty; Layer 2 makes evidence, methodology, provenance, counter-evidence, coverage, and missing evidence inspectable without forcing the user to read pipeline internals first."
  implementation_state: "WEB-GQR-4 asynchronous Research Sessions with progressive Ask polling is complete and merged as PR #106. knowledge-engine-ai PRs #130 and #131 are merged and provide the structured ResearchReport contract plus safe completed-session integration seam. Web PR #109 (merged) pins that AI revision, carries ResearchReportBuildResult through WebResearchResult, and persists its typed payload in durable async job results. Web PR #110 (merged) renders Layer 1. Web PR #111 (merged) renders the Layer 2 audit trail: conclusion-level supporting/null-or-contradictory evidence IDs, directness, direct/indirect summaries, indexed-vs-acquired-during-run provenance, provider coverage/degradation/status, limitations/missing evidence, and session/state identity. Web PR #112 (merged) turned those structured EvidenceRecord IDs into safe navigation to the existing authoritative claim/evidence/source-detail route without duplicating or fabricating source metadata. Web PR #113 (merged) made ordinary Ask requests enter bounded Research by default instead of requiring an explicit opt-in. Deployed Monster #79 acceptance remains open."
  blocking_gap: "All known Web-side code defects for Research Report v1 are fixed and merged (PRs #109-#113). Deployed Monster #79 acceptance is now blocked purely on hosted-runtime capability: PR #113 confirmed the current hosted Render alpha still intentionally fails the Research capability gate, which requires knowledge-engine-core's persistent Research workspace bootstrap (core PR #451, open and currently blocked pending a human decision on a CI secret-scan false positive) plus durable storage and reachable inference before Monster #79 can run end to end on the deployed path."
  priority_rule: "Until Monster #79 passes on the deployed Ask path, Research Report v1 integration outranks decorative UI work and unrelated non-blocking backend abstractions."

research_report_v1_handoff:
  completed_foundation:
    - "PR #106 — asynchronous Research Sessions with progressive Ask polling — merged to main and validated with Quality, Docker, container smoke, and TruffleHog checks."
    - "Ask returns immediately with deterministic indexed retrieval while Research mode continues in the background."
    - "The page polls durable session state and renders only verified/releaseable final research output."
    - "Current Ask already exposes provider coverage/degradation, indexed-vs-new evidence provenance, acquisition/extraction funnel facts, limitations, resolved citations, and research latency."
    - "AI PR #130 provides the typed ResearchReport contract and deterministic validation."
    - "AI PR #131 provides a fail-closed completed-session integration seam that returns a ResearchReportBuildResult without weakening the base verified result."
    - "PR #109 (merged) pinned the AI revision, carried ResearchReportBuildResult through WebResearchResult, and persisted its typed payload in durable async job results."
    - "PR #110 (merged) renders Layer 1 on Ask: bottom_line, conclusion_rows (dimension/conclusion/certainty/rationale), and missing_direct_evidence as a first-class limitation."
    - "PR #111 (merged) renders the structured Layer 2 audit trail for evidence relationships, directness, provenance, provider coverage/degradation, limitations, and session identity."
    - "PR #112 (merged) links Layer 2 EvidenceRecord IDs to the existing authoritative /claims/{evidence_record_id} route; docs/research_report_v1.md records a remaining richer inline study-detail follow-up where the authoritative detail surface lacks a requested study attribute (not yet scheduled)."
    - "PR #113 (merged) made ordinary Ask requests enter bounded Research by default; quick=1 is the explicit fast indexed-search opt-out, and legacy synthesize=1/0 URLs remain compatible."
  current_work_in_progress: null
  exact_next_sequence:
    - "1. Preserve the existing asynchronous session/polling behavior from PR #106; structured-report rendering must not regress immediate indexed retrieval or truthful durable progress."
    - "2. If structured report generation is unavailable or fails, preserve the already-verified base result and show an honest structured-report-unavailable state; never replace a valid grounded answer with a fabricated report."
    - "3. Wait for knowledge-engine-core's persistent Research workspace bootstrap (core PR #451) to be unblocked and merged, and for the hosted Render alpha to actually pass the Research capability gate (durable storage + reachable inference + deployable Core Research command surface)."
    - "4. Deploy and run Monster #79 end to end. Record session ID, BT-2 funnel, time to first grounded information, time to final report, provider coverage/degradation, promoted Evidence Records, final ResearchState, every conclusion row, missing evidence, and resolved citations/source-detail navigation."
    - "5. Fail acceptance honestly on any unsupported claim, missing dimension, collapsed evidence boundary, omitted counter-evidence, hidden missing-one-year-evidence gap, broken evidence-detail navigation, or materially worse readability than the scholarly-assistant baseline. Fix and rerun until it passes."
  layer_1_required_dimensions_for_monster:
    - "acute post-consumption blood-pressure effect"
    - "persistent habitual/baseline/resting/ambulatory BP evidence"
    - "incident hypertension risk over longer follow-up"
    - "BP measurement artifact from recent caffeine intake"
    - "Zero Ultra vs Original Monster long-term context"
    - "whether direct approximately one-year Monster/energy-drink evidence was actually found"
    - "certainty and missing evidence for each conclusion"
  nonnegotiable_invariants:
    - "The main answer must be understandable without opening methodology."
    - "Web consumes structured AI report fields; it does not scrape narrative prose for conclusions, certainty, provenance, or evidence classifications."
    - "Direct Monster evidence, class-level energy-drink evidence, and indirect caffeine/coffee/soda evidence remain distinguishable."
    - "Positive and null/contradictory evidence remain inspectable."
    - "Missing direct long-duration evidence cannot be buried inside generic limitations."
    - "Provider degradation, provenance, and source links are never hidden merely to simplify the page."
    - "Research progress never claims a stage succeeded before durable state says it did."
    - "Existing deterministic verification and Research ISA release gates remain authoritative."
  done_when: "Research Report v1 is not complete until the deployed Monster #79 Ask report is at least as readable/useful as the scholarly-assistant baseline while satisfying every evidence/provenance/missing-evidence acceptance requirement."

