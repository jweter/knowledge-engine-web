mobile_product_reality_track:
  name: "Mobile Product Reality"
  tracking_issue: "#140"
  portfolio_relation: "jweter/project-orchestrator#44"
  state: "backend/UI capability merged (#144); provenance hardening + legacy-schema migration merged (#145); not yet acceptance-complete"
  implementation_state: "PR #141 (merged) added the sanitized MobileSmokeEvidence contract (privacy-safe question hashing, fail-closed automated evidence state, notes never in the public payload). PR #144 (merged) wired it to real data: mobile_smoke_evidence_from_job derives response_state/evidence_count/provenance_traceable from the same durable async-Research job payload Layer 2 already renders (never a second, divergent computation); mobile_review_store persisted one human PASS/FAIL/FLAG verdict per session_id (single-row-per-session, upserted); GET/POST /ask/session/{id}/mobile-review expose this; ask.html shows a PASS/FAIL/FLAG panel once a session reaches terminal state, gated by the same AlphaBasicAuthMiddleware as the rest of the deployment. Verified with a real uvicorn instance plus a headless Chromium (390px viewport) run of the actual template/JS -- not just unit tests; caught and fixed one real bug this way. That ad hoc verification approach is now committed, reusable infrastructure -- see browser_e2e_track below. PR #145 (merged) hardens provenance on top of merged #144 per Jeremy's explicit request: (1) a recorded verdict now carries its own exact build identity (web_commit + verified flag) captured at submission time via web_build_identity()/build_identity_is_verified() -- RENDER_GIT_COMMIT for a real deploy, the new KE_WEB_BUILD_COMMIT for the zero-cost/local runtime that is now authoritative (see product_decisions), or an honest unverified placeholder -- and public_payload()'s review_authoritative/remaining_acceptance_debt fields refuse to present an unverified-build verdict as settled; (2) mobile_review_store is now append-only (a new SQLite row per submission, never an UPSERT), so an earlier FAIL/FLAG is never erased by a later PASS -- read_mobile_review still answers 'what is current', read_mobile_review_history exposes the full sequence, and the GET payload's review_history_count proves nothing was lost; (3) because #144 already merged and could have created real databases on its own single-row-per-session schema, #145 also adds a transactional, idempotent migration (_ensure_migrated/_migrate_legacy_schema_if_needed in mobile_review_store.py) that detects that exact legacy shape before any read or write, atomically rewrites it into the append-only schema preserving every row, and marks every migrated row honestly unverified (empty web_commit, build_identity_verified=false) rather than fabricating a build identity it never recorded; an unrecognized schema is refused (RuntimeError) rather than guessed at. Raw question text and free-form notes are still never returned in any payload."
  remaining_acceptance_debt: "Human iPhone Mobile Safari Product Reality review has not run. The review routes key off the async Research job projection, so they only serve sessions where Research mode actually ran -- on the current retrieval-only default Render deployment, a plain indexed Ask has no session to review through this path yet. Per the 2026-09-11 product decision, the fix is to verify Research capability on the zero-cost/local runtime (not paid hosted Research) and set KE_WEB_BUILD_COMMIT there so a real human review can be recorded as authoritative."
  not_done: "Issue #140 is not closed by this work; do not claim it complete without an actual recorded, authoritative (verified build identity) PASS/FAIL/FLAG from a real iPhone Safari session."

unattended_worker_track:
  name: "Route browser and service verification through unattended worker"
  tracking_issue: "#160"
  roadmap_file: "docs/UNATTENDED_VERIFICATION.md"
  state: "first four slices implemented (preflight/ollama_health, browser_ask, browser_e2e, screenshot evidence); only a live deployed target remains open"
  implementation_state: "knowledge-engine-core issue #493's coordinated WorkerRequest/WorkerResult contract merged and its Core-side worker runtime is live, unblocking the Web consumer work this file's own 2026-09-13 note had deferred to avoid duplicating that in-flight producer work. PR #183 (merged 2026-09-20) implemented Web's own consumer: knowledge_engine_web/unattended_verification_contract.py vendors the Core contract shape field-for-field (Web does not import Core as a library, per this repository's architecture boundary); knowledge_engine_web/unattended_worker.py binds to an exact repository/branch/SHA checkout (refusing a wrong branch, mismatched SHA, or dirty/untracked tree), and supported `preflight` (engineering/preflight.py) and `ollama_health` (loopback Ollama reachability) as the bounded first pair of checks; knowledge_engine_web/unattended_worker_publication.py posts a sanitized result to issue #160 as best-effort Windows-only remote observability, mirroring Core's issue-#493 publisher. PR #184 hardened that publisher's secret redaction (unquoted Bearer tokens). PR #186 (merged 2026-09-21) added the second slice: a `browser_ask` check reusing the exact critical real-Chromium Ask-path test subset already required by .github/workflows/quality.yml (BROWSER_ASK_TESTS in unattended_worker.py) against the same isolated local fixture server tests/test_browser_e2e.py already starts. PR #187 (merged 2026-09-21) added the third slice: a `browser_e2e` check that runs pytest's full `-m browser_e2e` marker (`run_browser_e2e()` in unattended_worker.py) -- the same suite .github/workflows/browser-e2e.yml already runs advisory-only, covering accessibility/axe-core, alpha-auth, keyboard navigation, character-key shortcuts, focus order/input, hover/focus disclosure, reduced motion, reflow/focus indicators, and target size, on top of browser_ask's base coverage. This run (2026-09-25) added the fourth slice, issue #160's remaining named 'screenshot evidence' scope: both run_browser_ask and run_browser_e2e now set SCREENSHOT_DIR_ENV_VAR (KE_WEB_BROWSER_E2E_SCREENSHOT_DIR) in the pytest subprocess's environment (run_logged gained an `env` parameter for this), and the shared `page` fixture (tests/conftest.py, via tests/_browser_e2e_support.py::capture_page_screenshot) captures a best-effort PNG of each test's final page state into <state_dir>/screenshots/<check>/<test-nodeid>.png on teardown, swallowing capture failures so a crashed/closed page never turns a passing test red. Each check's summary now reports the captured screenshot count and sanitized directory alongside its existing PASS/FAIL/duration/test-count text. No shared-contract (WorkerRequest/WorkerResult) field was added, so this required no cross-repository coordination with Core's issue #493 schema."
  not_done: "Exercising a live *deployed* target rather than an isolated local fixture server remains open -- issue #160's only still-open acceptance scope. Neither browser_ask nor browser_e2e has been exercised against a real local Windows/Ollama environment end to end through the worker CLI (no such environment in this sandbox). This run verified the new screenshot-evidence slice directly: a real `poetry run python -c '...run_browser_ask(...)'` invocation against this exact checkout returned PASS with all 6 real-browser tests passing and 6 real PNG screenshots captured on disk (one visually confirmed as a genuine rendered homepage, not a blank/error page); `poetry run pytest -q -m \"not browser_e2e\"` (the full deterministic suite) was GREEN; `ruff format --check .`, `ruff check .`, and `mypy knowledge_engine_web tests` (102 files) were all clean. A full local `pytest -m browser_e2e` run (the full real-Chromium suite, to additionally confirm no regression in the shared `page` fixture across every existing browser test module) completed after this note was first drafted: GREEN, zero failures, in 24m53s -- confirming the screenshot-capture teardown does not disturb any of the ~150 existing accessibility/alpha-auth/keyboard-navigation/focus-order/reduced-motion/target-size tests that also use the `page` fixture. 4 new focused unit tests (tests/test_browser_e2e_support.py) plus 4 new tests in tests/test_unattended_worker.py cover the env-var plumbing and summary text for both checks."

